# Local Postgres for development and integration tests.
#
#   make db-up       start it
#   make db-schema   apply config/schema.sql
#   make db-reset    destroy the volume and rebuild from schema
#
# Credentials come from .env (copy .env.example). The defaults below are for
# a local container that is not reachable from outside this machine; do not
# reuse them anywhere that is.

services:
  postgres:
    image: postgres:15
    container_name: general_war_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-general_war}
      POSTGRES_USER: ${POSTGRES_USER:-general_war}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-general_war}
      # Deterministic collation: ORDER BY on commander names must not depend
      # on the host locale, or rankings shift between machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bind to loopback only. Without the host part Docker publishes on
      # 0.0.0.0 and the database is exposed to the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Named user, not the implicit root: pg_isready reports ready before
      # the role exists otherwise, and db-schema then fails on connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-general_war} -d ${POSTGRES_DB:-general_war}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
