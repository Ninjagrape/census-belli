stage: report
description: >
  Turn the fitted model's posterior into publishable output. Generates the
  ranked table of generals with credible intervals, an interactive explorer
  for drilling into any general's battle-by-battle WAR contributions, a
  static markdown report with embedded figures for the README, and flat
  CSV/JSON exports. This stage is presentational: it performs no inference
  and must not recompute anything the model or evaluate stages already wrote.
  Where a number appears in the report it is read from the database, not
  derived here.

inputs:
  - db: model_runs                      # pick the run to report on
  - db: general_skill_estimates         # skill posteriors, WAR aggregates, ranks
  - db: battle_war_details              # per-battle WAR decomposition
  - db: generals, battles, battle_sides, battle_commanders
  - data/processed/model_diagnostics/run{N}/gate_report.json    # model gates of the reported run
  - data/processed/model_diagnostics/run{N}/rubin_per_general.csv   # per-general battle counts
  - data/processed/evaluation/run{N}/evaluation_report.json     # from the evaluate stage
  - data/processed/evaluation/run{N}/sensitivity/               # variant rankings, one CSV each
  - data/processed/evaluation/run{N}/figures/                   # diagnostic plots from evaluate

outputs:
  - data/processed/report/rankings.csv          # flat export, one row per general
  - data/processed/report/rankings.json         # same data, nested with per-battle detail
  - data/processed/report/explorer.html         # self-contained interactive explorer
  - data/processed/report/report.md             # static narrative report
  - data/processed/report/figures/              # forest plot, plus evaluate's PNGs copied in
  - data/processed/report/manifest.json         # counts, provisional flag and the stage-side gates
  - db: none                                    # this stage is read-only against the database

tools:
  - db_query              # read-only SQLAlchemy Core queries
  - plotly_figure         # interactive figures for the explorer
  - matplotlib_figure     # static figures for the markdown report
  - file_write

params:
  # which model run to report on; 'latest' resolves to the newest
  # bradley_terry_hierarchical run that converged and wrote estimates
  # (quality.EVALUABLE_RUN_PREDICATE, the run evaluate validated). Every gate
  # below selects the same run; a bare MAX(run_id) over model_runs can name a
  # reconcile, impute, sensitivity or unconverged run.
  run_selection: latest
  require_passing_diagnostics: true   # false stops failed blocking model gates marking outputs provisional

  # where the stage reads and writes; tests point these at temp directories
  output_root: data/processed/report
  diagnostics_root: data/processed/model_diagnostics
  evaluation_root: data/processed/evaluation
  # the evaluate spec; its severities decide which failed evaluate gates block
  evaluate_spec_path: agents/evaluate.yaml
  # the manifest the evaluation_gate checks below read (quality._SPEC_PARAM_BINDINGS
  # binds evaluation_gate.report to this param, so they cannot be pointed at
  # evaluate's own report)
  report_path: data/processed/report/manifest.json

  # rankings table
  top_n: 100
  ci_level: 0.95              # must match the CI stored on general_skill_estimates; others are refused
  min_battles: 3              # generals below this are excluded from the headline
                              # ranking and listed separately as under-determined

  # the headline ranking is fragile where CIs overlap; surface that rather
  # than implying false precision in the ordering
  show_rank_overlap: true
  overlap_threshold: 0.5      # flag adjacent ranks whose 95% CIs overlap by more than this

  # explorer
  explorer_max_generals: 1000     # searchable set; beyond this the page gets heavy
  explorer_embed_data: true       # must stay true: the explorer is one offline file

  # exports
  export_float_precision: 4

prompt: null   # deterministic rendering, no LLM needed

quality_checks:
  - name: top_rankings_have_intervals
    check: >
      SELECT COUNT(*) FROM general_skill_estimates
      WHERE run_id = (
        SELECT MAX(run_id) FROM model_runs
        WHERE model_type = 'bradley_terry_hierarchical'
          AND diagnostics ->> 'converged' = 'true'
          AND diagnostics ->> 'estimates_written' = 'true'
      )
        AND rank <= 100
        AND (skill_ci_lo IS NULL OR skill_ci_hi IS NULL OR war_sd IS NULL)
    threshold: "= 0"
    severity: error
    description: "Every reported general must carry uncertainty; a point estimate alone is not publishable"

  - name: export_non_empty
    check: >
      SELECT COUNT(*) FROM general_skill_estimates gse
      WHERE gse.run_id = (
        SELECT MAX(run_id) FROM model_runs
        WHERE model_type = 'bradley_terry_hierarchical'
          AND diagnostics ->> 'converged' = 'true'
          AND diagnostics ->> 'estimates_written' = 'true'
      )
        AND gse.n_battles >= 3
    threshold: "> 0"
    severity: error
    description: "The export must be non-empty; compare this count against the rankings.csv row count"

  - name: no_orphaned_war_details
    check: >
      SELECT COUNT(*) FROM battle_war_details bwd
      LEFT JOIN general_skill_estimates gse
        ON gse.run_id = bwd.run_id AND gse.general_id = bwd.general_id
      WHERE bwd.run_id = (
        SELECT MAX(run_id) FROM model_runs
        WHERE model_type = 'bradley_terry_hierarchical'
          AND diagnostics ->> 'converged' = 'true'
          AND diagnostics ->> 'estimates_written' = 'true'
      )
        AND gse.estimate_id IS NULL
    threshold: "= 0"
    severity: error
    description: "Every per-battle WAR row must belong to a general present in the same run's estimates"

  - name: war_decomposition_reconciles
    check: >
      SELECT COUNT(*) FROM (
        SELECT gse.general_id
        FROM general_skill_estimates gse
        LEFT JOIN battle_war_details bwd
          ON bwd.run_id = gse.run_id AND bwd.general_id = gse.general_id
        WHERE gse.run_id = (
          SELECT MAX(run_id) FROM model_runs
          WHERE model_type = 'bradley_terry_hierarchical'
            AND diagnostics ->> 'converged' = 'true'
            AND diagnostics ->> 'estimates_written' = 'true'
        )
        GROUP BY gse.general_id, gse.total_war
        HAVING ABS(gse.total_war - COALESCE(SUM(bwd.war_contribution), 0)) > 0.01
      ) t
    threshold: "= 0"
    severity: error
    description: "Aggregate WAR must equal the sum of its per-battle contributions, or the explorer will contradict the ranking"

  - name: reported_run_converged
    # The run selection already excludes unconverged runs, so this asks
    # whether any publishable run exists at all.
    check: >
      SELECT COUNT(*) FROM model_runs
      WHERE model_type = 'bradley_terry_hierarchical'
        AND diagnostics ->> 'converged' = 'true'
        AND diagnostics ->> 'estimates_written' = 'true'
    threshold: "> 0"
    severity: error
    description: "Never publish a ranking from a run that did not converge; with no converged pooled run there is nothing to report"

  - name: exclusion_concentration
    check: "top-50 generals have most of their battles credited"
    method: model_gate
    params: {gate: exclusion_concentration, root: data/processed/model_diagnostics, run: evaluable}
    severity: error
    description: >
      The model stage's exclusion_concentration gate, read from the reported
      run's gate_report.json and raised to an error: do not publish while any
      top-50 general has most battles uncredited or over 30% of
      multi-commander sides are default_split (before classify's LLM pass).

  - name: rank_ties_are_resolved
    check: >
      SELECT COUNT(*) FROM (
        SELECT run_id, rank
        FROM general_skill_estimates
        WHERE run_id = (
          SELECT MAX(run_id) FROM model_runs
          WHERE model_type = 'bradley_terry_hierarchical'
            AND diagnostics ->> 'converged' = 'true'
            AND diagnostics ->> 'estimates_written' = 'true'
        )
        GROUP BY run_id, rank
        HAVING COUNT(*) > 1
      ) t
    threshold: "= 0"
    severity: warning
    description: "Duplicate rank values indicate the ranking was not resolved deterministically"

  - name: export_matches_db
    check: "rankings.csv headline rows equal the database count"
    method: evaluation_gate
    params: {report: data/processed/report/manifest.json, gate: export_matches_db}
    severity: error
    description: "The CSV must hold exactly the generals the database has at or above min_battles"

  - name: evaluation_current
    check: "the evaluation report read describes the reported model run"
    method: evaluation_gate
    params: {report: data/processed/report/manifest.json, gate: evaluation_current}
    severity: error
    description: >
      Read from the manifest, whose model_run_id the evaluation_gate handler
      compares with the newest evaluable run. Fails when evaluate has not run
      for this model run, so a stale evaluation cannot vouch for the ranking.

retry_policy:
  max_stage_retries: 1
  on_failure: pause_and_alert
  remediation_hints:
    - "If top_rankings_have_intervals fails, the model stage did not write CI columns; re-run model rather than patching here"
    - "If reported_run_converged fails, fix convergence in the model stage; do not publish with require_passing_diagnostics disabled"
    - "If war_decomposition_reconciles fails, the WAR aggregation in the model stage disagrees with its own per-battle output"
