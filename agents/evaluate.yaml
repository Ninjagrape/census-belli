stage: evaluate
description: >
  Validate the latest converged primary model run: held-out prediction,
  posterior predictive checks, sensitivity refits, and comparison against
  named sanity checks and external rankings. Writes files only; no
  model_runs or general_skill_estimates rows, so MAX(run_id) over model_runs
  still names the published run.

  Target run. The newest bradley_terry_hierarchical row with
  diagnostics->>'converged' = 'true' and estimates written. The imputed
  rounds on disk must come from that run's imputation_run_id
  (check_round_provenance), or the stage refuses.

  Held-out prediction. Battles are split into held_out_folds seeded folds.
  Each fold refits the model on cv_rounds imputed rounds with the held-out
  battles' outcomes masked out of the likelihood (loglik_weight 0); they stay
  in the design, so a general seen only in held-out battles, and every
  held-out latent side, samples from its prior predictive. Leakage: impute
  conditions troops on outcome, so a held-out battle's imputed force ratio
  encodes its result. Prediction therefore draws x_A - x_B from the
  measurement-only prior (joint_x_diff_prior), never from the imputed rounds.
  Residual leakage (impute's hyperparameters saw every outcome) is disclosed
  in the report. Metrics on battles A won or lost outright: accuracy (Wilson
  interval), Brier, calibration bins; on exact outcomes, ranked probability
  score; on every battle, log score of the observed interval. Baselines:
  chance, and "larger measured army wins". The model is also scored on exactly
  the battles that baseline covers (decided, both sides measured), as
  on_force_baseline_mask, so the comparison is like for like.

  Two arms, reported as cv.imputed and cv.joint. The imputed arm trains on
  imputed x_diff (outcome-conditioned) and predicts from the measurement-only
  prior, so it mixes model quality with a circularity penalty. The joint arm
  fits the joint latent-troops model once per fold with the same likelihood
  mask and predicts held-out battles from the posterior draws' own
  x_diff_latent (which, at weight 0, samples the measurement prior). The gates
  held_out_accuracy, calibration and cv_converged use the imputed arm, which is
  what the published ranking resembles. The joint arm is reported alongside; if
  it does not converge that is recorded and the stage does not fail.

  Sensitivity. A baseline refit and every variant use the same
  sensitivity_rounds rounds and seeds, so differences are the variant's, not
  Monte Carlo's. Post-hoc variants re-reduce the baseline draws without a
  refit. A variant whose design equals the baseline's is reported no_op and
  not refitted. Rankings are compared by Spearman over common generals and
  top-N overlap, against the baseline refit and against the published run.

  observed_only changes the sample and removes imputation at once, so its
  companion refit observed_only_imputed_subset fits the same both-measured
  battles on the imputed rounds' x_diff; observed_only is reported against it
  (isolating imputation and circularity) as well as against the baseline.
  sensitivity.noise_floor is the baseline refitted under another seed offset
  and, when the imputed rounds on disk allow, a disjoint set of
  sensitivity_rounds rounds (else the same rounds), compared with the baseline:
  the top-N overlap two fits of the same model reach by chance. It is shown in
  the ranking_stability gate's actual and message; the pass rule is unchanged.

  Named checks and external rankings come from config/expert_rankings.yaml,
  keyed by Wikidata Q-id. A check whose general is not ranked is
  not_evaluable, which fails its gate rather than passing silently.

  g_unlabelled sensitivity. Reconcile's shared unlabelled-regime offset is its
  largest shared error. g_unlabelled_plus_1sd and g_unlabelled_minus_1sd read
  reconcile's neutral_draws_run{id}.npz (newest written neutral run, from
  reconcile_root), regress each side's neutral draws on g_unlabelled across
  draws (a_era as a second regressor when present) for a slope B_s, and move
  every side's log troops in every imputed round by B_s * (+/-1) *
  sd(g_unlabelled), then refit on the rebuilt force ratios. A side with no
  usable slope of its own (missing from the npz, or is_imputed in the round's
  sides.csv) takes the precision-weighted mean slope of the observed sides in
  its era (impute's era bins; precision is 1 / variance of the side's neutral
  draws), so it is neither left unshifted nor shifted by a prior-filled slope.
  Rounds already carry theta draws, so +/-1 sd moves the centre of an already
  dispersed set: the variant tests misspecification of g's posterior mean (the
  faithful-component prior choice), not its spread. Approximation: imputed
  sides depend on observed sides through the imputation model, which is not
  re-run. A file without g_unlabelled, a missing file or sd 0 reports
  not_evaluable with a reason; that neither fails ranking_stability nor goes
  unreported. Each is compared with the baseline by rank correlation, top-N
  overlap and the largest rank change inside the baseline's top N
  (max_abs_rank_change_top).

inputs:
  - data/processed/reconcile/neutral_draws_run{N}.npz   # g_unlabelled variants only
  - db: model_runs, general_skill_estimates, generals
  - db: battles, battle_sides, battle_commanders
  - data/imputed/{scale}/round_*           # the rounds the target run was fitted on
  - data/processed/model_diagnostics/run{N}/
  - config/expert_rankings.yaml

outputs:
  - data/processed/evaluation_report.json  # latest; carries model_run_id and gates
  - data/processed/evaluation/run{N}/      # report copy, cv_predictions.csv, sensitivity/*.csv, figures/*.png

tools: []

params:
  # Model parameters (priors, sampler, write thresholds, scale, imputed_root)
  # come from this spec's params via load_model_params, as in the model stage.
  model_spec: agents/model.yaml
  expert_rankings: config/expert_rankings.yaml
  reconcile_root: data/processed/reconcile
  output_root: data/processed/evaluation
  report_path: data/processed/evaluation_report.json
  seed: 20261014

  held_out_folds: 5
  # Imputed rounds per fold fit, mixture-pooled for prediction.
  cv_rounds: 3
  # Sampler draws per chain for evaluation fits; tune is the model's. Lower
  # than the model's 3000 because evaluation fits are compared, not published,
  # but each still has to meet the model's write thresholds.
  eval_draws: 1500
  # Bulk ESS floor for evaluation fits, lowering the model's publish threshold
  # (800) to this value, never raising it above the model's: at eval_draws they
  # reach ~715-760, and these fits are compared, not published. 400 is the bar
  # reconcile and the recovery suites use. max_rhat and max_divergences stay the
  # model's.
  eval_min_ess_bulk: 400
  calibration_bins: 5

  sensitivity_rounds: 5
  top_n: 20
  min_top_overlap: 12          # of top_n; scaled down when fewer generals are ranked

  sensitivity_variants:
    - name: drop_low_quality
      kind: battle_filter
      description: "Drop battles with data_quality_score < 0.3"
      min_quality: 0.3
    - name: observed_only
      kind: x_source
      description: "No imputation: battles with both sides measured, x_diff from reconcile's neutral means"
    # Skills stay hierarchically shrunk: skill_prior_sd scales the HalfNormal
    # on sigma_skill, and the cutpoint and latent-side priors are unchanged.
    - name: weak_hyperpriors
      kind: priors
      description: "Wider hyperprior on the skill sd and a wider force-slope prior"
      skill_prior_sd: 5.0
      beta_force_sd: 2.0
    - name: equal_attribution
      kind: side_transform
      description: "Equal credit to every commander on a side, default_split sides included"
    - name: field_commanders_only
      kind: side_transform
      description: >
        Drop sovereign and nominal commanders (never emptying a side). A
        commander with no recorded role is kept. A side whose kept commanders
        have no positive finite weight gets equal weights (sides_reweighted).
      exclude_roles: [sovereign, nominal]
    - name: exclude_extreme_ratio
      kind: battle_filter
      description: >
        Drop battles whose measurement-only |x_A - x_B| (both sides measured,
        obs_mean[A] - obs_mean[B], no imputation) exceeds 2 (odds worse than
        ~1:7). Imputed x_diff is outcome-conditioned and is not used. Battles
        with an unmeasured side are kept.
      max_abs_log_ratio: 2.0
    - name: three_level_outcome
      kind: design_transform
      description: "Collapse decisive and ordinary grades by interval censoring (win / indecisive / loss)"
    - name: g_unlabelled_plus_1sd
      kind: regime_shift
      description: >
        Shift the centre of the imputed rounds by +1 sd of reconcile's shared unlabelled-regime
        offset, scaled by each side's slope on it (era-mean slope for sides without their own)
      n_sd: 1.0
    - name: g_unlabelled_minus_1sd
      kind: regime_shift
      description: >
        Shift the centre of the imputed rounds by -1 sd of reconcile's shared unlabelled-regime
        offset, scaled by each side's slope on it (era-mean slope for sides without their own)
      n_sd: -1.0
    - name: replacement_50th
      kind: post_hoc
      description: "Replacement level at the median instead of the 40th percentile"
      replacement_percentile: 50
    - name: realised_war
      kind: post_hoc
      description: "Rank by realised WAR (outcome minus replacement) instead of expected WAR"
      rank_by: realised

prompt: null

quality_checks:
  - name: held_out_accuracy
    check: "Held-out binary accuracy above 0.55"
    method: evaluation_gate
    params: {gate: held_out_accuracy}
    threshold: "> 0.55"
    severity: warning

  - name: calibration
    check: "Held-out Brier score below 0.25 (a coin flip scores 0.25)"
    method: evaluation_gate
    params: {gate: calibration}
    threshold: "< 0.25"
    severity: warning

  - name: cv_converged
    check: "Every cross-validation fold fit met the model's write thresholds"
    method: evaluation_gate
    params: {gate: cv_converged}
    severity: warning

  - name: ranking_stability
    check: >
      Top-20 generals overlap by at least 12 between the baseline refit and
      every refitted variant (scaled down below 20 ranked generals)
    method: evaluation_gate
    params: {gate: ranking_stability}
    severity: warning

  - name: named_checks
    check: >
      Every gated check in config/expert_rankings.yaml passes (Agrippa above
      Octavian; Justinian has no credited battles); not_evaluable fails. Rank
      ranges (Napoleon, Alexander) are reported, not gated.
    method: evaluation_gate
    params: {gate: named_checks}
    severity: warning

retry_policy:
  # Fixed seeds: a retry would reproduce the same result.
  max_stage_retries: 0
  on_failure: complete_with_warnings
