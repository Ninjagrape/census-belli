stage: impute
description: >
  Multiple imputation of missing log troop totals, by one joint Bayesian model
  rather than MICE with predictive mean matching. Why: there is one missing
  variable (log troops) and every other field is a covariate, so chained
  equations would reduce to a single conditional model anyway, and PMM would
  only borrow values from other sides. The joint model marginalises each
  battle's shared effect analytically (one MvNormal per battle, over its
  observed sides), which handles a battle with both sides missing with no
  special case. Observed sides are overimputed: their latent value is redrawn
  given reconcile's likelihood rather than copied through, because treating a
  noisy estimate as exact puts its measurement error into the downstream
  force ratio as signal and attenuates beta_force. Era bins, era priors and
  hyperparameter scales live in config/imputation_priors.yaml.

  Outcome is a covariate of the imputation model on purpose. Rubin's
  compatibility condition for proper multiple imputation requires the
  imputation model to condition on every variable the downstream analysis
  uses; the model stage regresses outcome on the force ratio, so imputing
  without outcome would draw ratios that are independent of it and bias the
  slope toward zero. With overimputation there is a second route: an observed
  side's outcome-conditioned prior mean also informs its redrawn value, so
  observed sides carry outcome information through the prior mean as well as
  missing ones. The cost is that the imputed ratios are partly built from the
  outcome the model stage then explains with them. The check on that is
  evaluate's observed_only variant (fit on observed-only data, no imputed or
  overimputed values), which should agree with the imputed fit up to
  precision.

  Pooled 'unknown' level. A side with no polity (or no commander) falls in one
  shared 'unknown' level of that random effect. This is a deliberate
  missing-indicator choice: missing attribution tracks obscurity, so the
  pooled level absorbs that shift rather than treating the side as a random
  draw from the named polities.

  The likelihood is exported by reconcile, not recovered from its posterior.
  Until 2026-10-22 impute divided reconcile's side prior N(m0, s0^2) out of the
  neutral posterior and called a side weak when the remaining precision was at
  most min_lik_precision (0.5). The prior is a Student-t, so for a side far from
  m0 the posterior is wide and near-bimodal and the Gaussian division read it as
  uninformative: 75 of 341 sides were discarded (the largest and smallest
  armies) and the kept-pair log-ratio slope was 0.43. Reconcile's neutral fit now
  writes, per side with at least one point row, the likelihood mean and sd on
  the log scale from its point rows at the fitted noise (the rows' adjusted log
  reports combined by precision, with the Student-t Fisher information
  (nu + 1) / ((nu + 3) sigma^2) per row), in the neutral npz under the lik_*
  keys. min_lik_precision is removed: a side is missing only when it has no point
  row (bound_only or no_reports, or other when its reports were all excluded by
  reconcile's load filters), the count by cause is logged and recorded in
  gate_report.json, and no side with a point row is ever weak. An npz without the
  lik_* keys is refused with a message to re-run reconcile; there is no fallback.

  Shared reconcile error is propagated, approximately. Reconcile's neutral fit
  has measurement error shared across battles: the unlabelled-regime offset
  g_unlabelled, the era slope a_era and offset_bar (the corpus average of the
  regime and scope offsets). Its npz carries draws of the three, and, per side,
  the loading of the side's likelihood mean on each (the least-squares slope of
  the side's per-draw likelihood mean on the centred draw). In each round impute
  picks one reconcile draw (seeded per round, from a stream separate from the
  conditional draws, stratified on the leading parameter) and shifts every
  observed side's likelihood mean by its loading times that draw's centred
  parameters. All battles in a round share the draw, which restores the
  cross-battle correlation and the uncertainty in beta_force that independent
  per-battle Gaussians dropped. Imputed sides co-move too: each round adds, to the
  mean of every side, the precision-weighted mean likelihood loading of the
  observed sides in its era times the centred draw, so an imputed side shifts with
  the observed sides its era level is learned from. Remaining approximation: the
  dependence is linear-Gaussian and conditioned on three shared parameters only;
  any other shared structure (other regimes, source and scope terms beyond what
  offset_bar averages) is dropped. A draws file whose parameters do not vary
  falls back to independent battles and logs impute_shared_error_not_propagated;
  params.propagate_shared_error: false forces that. gate_report.json and each
  round manifest record whether it was on, the reconcile draw per round, the mean
  absolute loading and the share of side variance the parameters explain.
  Evaluate's +/-1 sd g_unlabelled variant tests misspecification of g's posterior
  mean (the rounds already carry theta), not what the approximation misses.

  Runs once per scale. neutral (primary) reads reconcile's regime-neutral
  fit (data/processed/reconcile/neutral_draws_run{run_id}.npz) and its exported
  per-side likelihood; published (sensitivity) reads
  battle_sides.est_troops_total and its interval, diagonally. Neutral values
  are for force ratios only and must never be displayed as troop counts.

inputs:
  - db: battles (year_astronomical, battle_type), battle_sides, battle_commanders,
        missing_data_log
  - data/processed/reconcile/neutral_draws_run{run_id}.npz   # neutral scale
  - config/imputation_priors.yaml

outputs:
  - data/imputed/{scale}/round_{n}/sides.csv      # columns side_id, battle_id, log_troops, is_imputed, scale
  - data/imputed/{scale}/round_{n}/manifest.json
  - data/imputed/{scale}/gate_report.json
  - "db: model_runs (one row per invocation, model_type='imputation')"
  - >-
    db: missing_data_log, neutral scale only (rows of sides that now carry a
    likelihood and that an earlier run imputed are deleted first; then
    troop_total rows of imputed sides:
    was_imputed, imputation_method 'bayes_joint_v1_neutral_log', imputed_value
    = exp(median over rounds), imputed_lo/hi = 2.5/97.5% of the n_imputations
    rounds, not of every retained posterior draw; notes says so). The
    published sensitivity run never writes this table.

tools:
  - pymc_fit
  - db_update

params:
  scale: neutral                      # 'neutral' (primary) or 'published' (sensitivity)
  n_imputations: 20
  # Primary analysis is MAR. mnar_delta is added to the imputed log value of
  # missing sides whose missing_data_log troop row is classified 'mnar'. The
  # evaluate stage's sensitivity grid is {-0.5, -0.25, +0.25, +0.5}; documented,
  # not yet run.
  mnar_delta: 0.0
  # min_lik_precision (0.5) was removed on 2026-10-22 together with the division
  # of reconcile's side prior: reconcile now exports each side's likelihood, a
  # side is missing only when it has no point row, and a leftover key in a
  # params override is ignored with a warning (impute_min_lik_precision_ignored).
  # Recovery gate thresholds (kept_pair_ratio_slope, kept_side_slope); a gate
  # skips, with its reason in actual, below slope_gate_min_n pairs or sides.
  min_pair_slope: 0.8
  min_side_slope: 0.9
  slope_gate_min_n: 10
  published_default_sd: 1.0           # log sd when a published estimate has no interval
  propagate_shared_error: true        # neutral scale: carry reconcile's g_unlabelled/a_era error across battles

  imputation_priors: config/imputation_priors.yaml
  reconcile_root: data/processed/reconcile
  imputed_root: data/imputed
  model_type: imputation

  # sampling
  # 4000, not 2000: on general_war_corpus2 after Phase 2 the polity sd tau_p
  # mixes slowly along a ridge with the one strongly offset, thinly observed
  # polity (Soviet Union, 3 sides; corr 0.88), giving ESS 302 at 2000 draws
  # (run 85, 0 divergences). Same model; user decision 2026-10-18.
  mcmc_samples: 4000
  mcmc_chains: 4
  mcmc_tune: 1500
  mcmc_target_accept: 0.9
  mcmc_cores: 1                       # >1 respawns the interpreter under pytest on Windows
  random_seed: 20261006
  nuts_sampler: nutpie

  # Nothing is written unless the fit meets these (same rule as reconcile).
  write_max_rhat: 1.01
  write_min_ess_bulk: 400
  write_max_divergences: 0

  # gate thresholds
  ratio_limit: 4.0                    # |log force ratio| < 4, about 55x
  value_min: 50
  value_max: 10000000
  ks_alpha: 0.01
  ks_min_n: 5

prompt: null   # statistical model, no LLM

quality_checks:
  - name: imputation_completeness
    method: imputation_gate
    params: {gate: imputation_completeness, root: data/imputed, scale: neutral}
    severity: error
    description: >
      Every in-scope side has a finite value in every round.

  - name: imputed_ratio_plausible
    method: imputation_gate
    params: {gate: imputed_ratio_plausible, root: data/imputed, scale: neutral}
    severity: error
    description: >
      Median |log ratio| across rounds < 4 for every multi-sided battle with at
      least one truly missing side; the message lists offending battle_ids.
      Fully observed battles are reconcile's responsibility, not imputation's,
      and a single tail round is posterior uncertainty, not a defect. Values
      are never clipped.

  - name: imputed_values_plausible
    method: imputation_gate
    params: {gate: imputed_values_plausible, root: data/imputed, scale: neutral}
    severity: error
    description: >
      Published scale only: imputed troop counts between 50 and 10,000,000.
      Passes as not applicable on the neutral scale, which is not a count.

  - name: distributional_check
    method: imputation_gate
    params: {gate: distributional_check, root: data/imputed, scale: neutral}
    severity: warning
    description: >
      KS test within era, imputed against observed. Expected to fire under MAR
      when missingness depends on covariates; read as information.

  - name: kept_pair_ratio_slope
    method: imputation_gate
    params: {gate: kept_pair_ratio_slope, root: data/imputed, scale: neutral}
    severity: error
    description: >
      Over battles with exactly two observed (point-reported) sides, the slope
      through the origin of the across-round mean imputed log ratio on the
      reported log ratio (the sides' likelihood means) is at least
      params.min_pair_slope (0.8). The model stage regresses outcome on this
      ratio, so a compressed ratio attenuates the force effect; it was 0.43 on
      the 2026-10 corpus. Skips (passes, with the reason in the gate's actual)
      below params.slope_gate_min_n battles.

  - name: kept_side_slope
    method: imputation_gate
    params: {gate: kept_side_slope, root: data/imputed, scale: neutral}
    severity: error
    description: >
      OLS slope of the across-round mean imputed log value on the reported
      (likelihood mean) log value over observed sides is at least
      params.min_side_slope (0.9). Observed sides are overimputed, not copied
      through, and must not be pulled away from their reports. Skips below
      params.slope_gate_min_n sides.

  - name: model_convergence
    check: "all rhat <= 1.01 and ess_bulk >= 400, no divergences"
    method: diagnostics_json
    params:
      model_type: imputation
      max_rhat: 1.01
      min_ess_bulk: 400
      max_divergences: 0
    severity: error
    description: The imputation model's sampler converged.

retry_policy:
  max_stage_retries: 0               # fixed-seed sampling: a re-run repeats the failure
  on_failure: pause_and_alert
