stage: model
description: >
  Fit the Bayesian Bradley-Terry hierarchical model. Each general has a
  latent skill parameter. Win probability depends on skill difference
  between opposing commanders, adjusted for force ratio, battle type,
  terrain, defensive advantage, and era. The model is fit on each
  imputed dataset separately, and posteriors are combined via Rubin's rules.

inputs:
  - db: battles, battle_sides, battle_commanders, generals
  - data/imputed/round_{n}/
  - config/model_default.yaml

outputs:
  - db: model_runs, general_skill_estimates, battle_war_details
  - data/processed/model_diagnostics/

tools:
  - pymc_fit
  - cmdstanpy_fit         # fallback if PyMC has convergence issues
  - db_insert
  - rubins_combine        # combine posteriors across imputation sets

params:
  # Model specification
  #
  #   P(side A wins battle b) = logistic(
  #       sum_i(w_i * s_i) - sum_j(w_j * s_j)     # weighted skill difference
  #     + beta_force * log(force_ratio_A/B)          # log force ratio
  #     + beta_def * I(A is defender)                 # defensive advantage
  #     + beta_type[battle_type]                      # battle type effect
  #     + alpha_era[era]                              # era random effect
  #   )
  #
  #   where w_i = attribution_weight for commander i on side A
  #         s_i ~ Normal(mu_era, sigma_era)           # hierarchical prior on skill
  #
  # Ordered outcome extension (decisive_defeat to decisive_victory):
  #   Use ordinal logistic (cumulative link) with the same linear predictor.

  # priors
  skill_prior_mu: 0.0
  skill_prior_sd: 1.5            # weakly informative, allows strong generals ~3 SD out
  beta_force_prior_mu: 0.5       # positive: more troops = higher win prob
  beta_force_prior_sd: 0.5
  beta_def_prior_mu: 0.3         # slight defensive advantage
  beta_def_prior_sd: 0.3
  era_sigma_prior: 0.5           # half-normal on era-level variance

  # replacement level for WAR calculation
  replacement_level: percentile_40    # skill at the 40th percentile of all generals

  # MCMC settings
  mcmc_samples: 3000
  mcmc_chains: 4
  mcmc_tune: 2000
  mcmc_target_accept: 0.9
  mcmc_max_treedepth: 12

  # fit on each imputation round
  fit_per_imputation: true

  # also fit on observed-only data for comparison
  fit_observed_only: true

prompt: null   # pure statistical model

quality_checks:
  - name: convergence
    check: "all rhat < 1.02 and ess_bulk > 800 for skill parameters"
    method: diagnostics_json
    severity: error

  - name: no_divergences
    check: "divergences < 10 across all chains"
    method: diagnostics_json
    severity: warning

  - name: skill_distribution_sensible
    check: >
      The posterior mean skill for the median general should be close to 0
      (within 0.1 of the prior mean)
    method: posterior_check
    severity: warning

  - name: top_generals_have_intervals
    check: >
      SELECT COUNT(*) FROM general_skill_estimates
      WHERE rank <= 50 AND skill_ci_lo IS NULL
    threshold: "= 0"
    severity: error

retry_policy:
  max_stage_retries: 1
  on_failure: pause_and_alert
  # if convergence fails, the alert should suggest:
  # - increase tune/samples
  # - use non-centered parameterisation
  # - reduce model complexity (drop era random effects)
  # - switch to CmdStanPy
  remediation_hints:
    - "Try non-centered parameterisation for skill parameters"
    - "Increase mcmc_target_accept to 0.95"
    - "Switch to CmdStanPy with adapt_delta=0.95"
    - "Check for near-separation: generals with 0% or 100% win rate and few battles"
