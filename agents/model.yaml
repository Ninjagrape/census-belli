stage: model
description: >
  A Bayesian ordinal Bradley-Terry model of commander skill, fitted on each
  imputed round and pooled, with expected Wins Above Replacement.

  Unit and outcome. A battle with exactly two sides; the outcome is one of five
  ordered levels from side A's perspective (A is the lower side_id, mirrored
  from B when A has none). Cumulative logit with symmetric cutpoints, so
  swapping A and B negates the linear predictor and reverses the scale and the
  likelihood does not change: listing order carries no information. A pair of
  reports that agree on win, draw or loss but differ in grade is
  interval-censored over the two grades.

  Linear predictor: S_A - S_B + beta_force * (x_A - x_B) + beta_def * (d_A - d_B).
  S_side is the attribution-weighted sum of the side's commanders' skills.
  Skill is sigma_skill * z with z standard normal (non-centred).

  Departures from the original spec, and why. beta_type, alpha_era and terrain
  are dropped as additive terms: they are battle-level, so with an arbitrary
  orientation they could only learn "side A tends to win", i.e. listing order.
  There is no era mean of skill: generals of different eras never meet, so it
  would be identified by the prior alone. The defender term is omitted while
  no battle has a flag. The fixed skill sd 1.5 is a learned sd with a
  HalfNormal(1.0) prior.

  Unattributed and unknown sides are not dropped. A side with no resolved
  commander, or whose co-commanders were all split evenly by default, is an
  anonymous latent (mu_unknown or mu_unattributed plus sigma_skill * z) that
  nobody is credited for; the battle still informs the opposing named general.
  A battle with no named side is excluded and counted.

  WAR. Per posterior draw the replacement level is the 40th percentile of
  credited generals' skill. A side's expected score is P(win) + 0.5 *
  P(indecisive). Stored WAR is expected WAR: the side's expected score at its
  fitted strength minus its expected score with the whole side replaced,
  opponent and forces unchanged, split among commanders by attribution weight.
  total_war is its sum per general, so it is volume-weighted (rank_by
  total_war is Arsht's choice; skill_mean is the per-battle alternative).
  Realised WAR (outcome minus replacement) is in the diagnostics only.
  win_prob_model and win_prob_baseline hold the expected score, not P(win).

  Pooling. One fit per imputed round; the pooled posterior is the mixture of an
  equal number of draws from each round, with Rubin's rules alongside:
  skill_sd and war_sd store sqrt(T), and the intervals are mixture quantiles
  widened by sqrt(T / mixture variance). FMI is a lower bound while the
  shared-error limitation (handover 21.7) stands. rhat and ESS are per round
  only. Nothing is written unless every round meets the write thresholds; a
  failing round is re-run once with a new seed and target_accept 0.95.

  Attribution weights are fixed data from classify, renormalised per side to
  sum to one; the model does not learn them.

  Disclosures. Technology is not modelled and one linear log-force-ratio slope
  serves every era. Naval and aerial battles are included and share the single
  skill population and the single beta_force with land battles (their counts
  are in the pooled diagnostics). Generals of different eras are tied together by the shared
  prior alone, and mu_unknown / mu_unattributed are a soft link between
  components. total_war is volume-weighted. The circularity comparator is a
  joint fit with a latent log-troop difference per battle (measured sides give
  N(m_A - m_B, sqrt(sd_A^2 + sd_B^2)); a missing side adds 2 sigma_w^2 around
  0, sigma_w = 1 by default) and no imputation, so absolute era levels play no
  part; it does not test the shared-error limitation.

inputs:
  - db: battles (year_astronomical), battle_sides (outcome, is_defender,
        est_troops_neutral_log_mean/_sd), battle_commanders (attribution_weight,
        attribution_method), generals
  - data/imputed/neutral/round_{n}/sides.csv and manifest.json   # manifest run_id must be the latest written neutral impute run
  - config/model_default.yaml

outputs:
  - "db: model_runs (one bradley_terry_round row per round, one bradley_terry_joint_latent row, and the bradley_terry_hierarchical pooled row last)"
  - "db: general_skill_estimates (pooled run and joint run) and battle_war_details (pooled run)"
  - data/processed/model_diagnostics/run{pooled_run_id}/rounds_summary.json
  - data/processed/model_diagnostics/run{pooled_run_id}/rubin_per_general.csv
  - data/processed/model_diagnostics/run{pooled_run_id}/components.json
  - data/processed/model_diagnostics/run{pooled_run_id}/gate_report.json
  - data/processed/model_diagnostics/run{pooled_run_id}/pooled_draws.npz

tools:
  - pymc_fit
  - db_insert

params:
  # Every number lives in config/model_default.yaml with the reason for it.
  # Keys added here override that file section by section.
  model_config: config/model_default.yaml

prompt: null   # pure statistical model

quality_checks:
  - name: convergence
    check: "all rhat <= 1.02 and ess_bulk >= 800 for every round"
    method: diagnostics_json
    # The numbers live here, not in the prose above: parsing the description
    # would make the gate depend on English word order. model_type is required
    # and has no default, because defaulting would read another stage's run and
    # pass this stage on somebody else's convergence. The pooled row's `worst`
    # is the worst case over rounds and its `converged` is 'false' if any round
    # failed after its retry.
    params:
      model_type: bradley_terry_hierarchical
      max_rhat: 1.02
      min_ess_bulk: 800
      max_divergences: 0
    severity: error

  - name: no_divergences
    check: "divergences < 10 across all rounds"
    method: diagnostics_json
    # Divergences only. rhat and ess are the convergence gate's business, so
    # they are relaxed here rather than double-reported as two failures.
    params:
      model_type: bradley_terry_hierarchical
      max_rhat: 1000.0
      min_ess_bulk: 0
      max_divergences: 9
    severity: warning

  - name: top_generals_have_intervals
    # -1 when the latest pooled run wrote no estimates, so an unwritten run
    # fails instead of passing on zero rows.
    check: >
      SELECT CASE WHEN COUNT(*) = 0 THEN -1
             ELSE COUNT(*) FILTER (WHERE rank <= 50 AND skill_ci_lo IS NULL) END
      FROM general_skill_estimates
      WHERE run_id = (
        SELECT MAX(run_id) FROM model_runs WHERE model_type = 'bradley_terry_hierarchical'
      )
    threshold: "= 0"
    severity: error

  - name: posterior_predictive_category_check
    check: >
      Observed frequency of each of the five outcome levels lies inside its
      99% posterior predictive interval (Bonferroni over five categories),
      computed on a representative round.
    method: model_gate
    params: {gate: posterior_predictive_category_check, root: data/processed/model_diagnostics}
    severity: warning

  - name: fmi_top_generals
    check: "no top-50 general has FMI above 0.3"
    method: model_gate
    params: {gate: fmi_top_generals, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      If it fires, raise n_imputations to 40. FMI is a lower bound while the
      shared-error limitation (handover 21.7) stands.

  - name: circularity_check
    check: "joint latent fit agrees with the pooled imputed fit"
    method: model_gate
    params: {gate: circularity_check, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      Impute conditions on outcome, so imputed force ratios are partly built
      from the outcomes this model explains. The comparator is one joint fit
      with a latent log-troop difference per battle and no imputation: beta_force within 0.5 joint
      sd, Spearman of skill means at least 0.9 over generals with 3 or more
      battles, top-50 overlap at least 40 (scaled down below 50 generals). It
      does not test the shared-error limitation.

  - name: exclusion_concentration
    check: "top-50 generals have most of their battles credited"
    method: model_gate
    params: {gate: exclusion_concentration, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      Fires if any top-50 general has under 50% of their battles credited, or
      over 30% of multi-commander sides are default_split. Severity is warning
      here but report must treat it as blocking (TODO.md).

  - name: extreme_ratio_dependence
    check: "no top-50 general earns most of their xWAR against extreme odds"
    method: model_gate
    params: {gate: extreme_ratio_dependence, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      Lists top-50 generals with over 50% of absolute xWAR from battles where
      own-minus-opponent log troops is below -2. One linear slope serves all
      eras and technology is not modelled.

  - name: implausible_career_span
    check: "no general's included battles span more than 60 years"
    method: model_gate
    params: {gate: implausible_career_span, root: data/processed/model_diagnostics}
    severity: warning
    description: A longer span usually means two people merged into one general.

  - name: prior_predictive_sensible
    check: "the priors alone imply a plausible tournament"
    method: model_gate
    params: {gate: prior_predictive_sensible, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      Fires if any outcome level exceeds 40% under the priors on the real
      design, or the median |expected score - 0.5| for random named pairings exceeds 0.35.

  - name: top_generals_cross_component
    check: "count of top-50 generals outside the largest component"
    method: model_gate
    params: {gate: top_generals_cross_component, root: data/processed/model_diagnostics}
    severity: warning
    description: >
      Warns when the count is above 0; details list the generals. Their level
      relative to the largest component rests on the shared prior alone.

  - name: exclusions_reported
    check: "at most half the battles in scope are excluded"
    method: model_gate
    params: {gate: exclusions_reported, root: data/processed/model_diagnostics}
    severity: warning
    description: The full exclusion breakdown is in the gate's details.

retry_policy:
  max_stage_retries: 1
  on_failure: pause_and_alert
  # A round that fails the write thresholds is already re-run once inside the
  # stage (new seed, target_accept 0.95). If convergence still fails, suggest:
  remediation_hints:
    - "Increase sampler.draws and sampler.tune in config/model_default.yaml"
    - "Look for near-separation: generals with 0% or 100% win rate and few battles"
    - "Check components.json for a weakly connected component"
    - "Switch to CmdStanPy with adapt_delta=0.95"
