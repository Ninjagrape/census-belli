stage: reconcile
description: >
  Reconcile conflicting troop and casualty reports from multiple sources
  into best estimates with confidence intervals. Uses a hierarchical
  source-bias model: each source has a latent bias and precision,
  learned from battles where many sources overlap, then applied to
  battles with fewer sources.

inputs:
  - db: troop_reports, casualty_reports, sources, battle_sides, battles

outputs:
  - db: battle_sides (est_troops_total, est_troops_total_lo/hi, est_casualties,
        est_casualties_lo/hi, plus the est_*_run_id / _n_reports / _n_sources /
        _method / _updated_at provenance columns)
  - db: sources (troop_bias_mu/sd, troop_sigma_mu/sd, casualty_bias_mu/sd,
        casualty_sigma_mu/sd, bias_run_id, bias_n_*_reports, bias_updated_at)
  - db: battle_sides (est_troops_neutral, _lo, _hi, _log_mean, _log_sd, the
        regime-neutral troop total from a second fit, for force ratios only;
        is_defender is added but not populated here)
  - db: model_runs (one row per run, model_type='source_disagreement',
        carrying the sampler diagnostics the model_convergence gate reads, and
        a troops_neutral block the neutral_fit_converged gate reads)
  - data/processed/reconcile/neutral_draws_run{run_id}.npz (joint log-scale
        draws of the neutral fit, read by the impute stage)
  - db: missing_data_log (field_name='troop_total' / 'casualties' for sides
        that have reports but none the model can use)
  - data/processed/reconciliation_report.json

tools:
  - pymc_fit            # fit the source-bias model
  - db_update

params:
  # ── source-bias model priors ──────────────────────────────────────────────
  bias_prior_sd: 1.0                  # weakly informative
  # Inverse-gamma on each source type's noise variance. The original IG(2, 1)
  # has infinite variance on a parameter that sets every interval width, so
  # alpha is 3. Beta 4/3 preserves the original mode, beta / (alpha + 1) = 1/3,
  # rather than the mean: IG(3, 2) kept the mean at 1 but is a far stronger
  # prior (mode 0.5, thin tail) and shrank two-report sides.
  precision_prior_alpha: 3.0          # inverse-gamma shape
  precision_prior_beta: 1.3333333333333333

  # The ancient-inflation prior is no longer a single mu/sd pair. A normal
  # centred on 0.3 means 1.35x inflation and cannot reach 6x even at three
  # sigma, while the documented cases run 4x-20x (Gaugamela, Nicaea, the
  # Helvetii, Xerxes) -- and Cannae's Polybian figures are accepted at face
  # value, so the distribution is a mixture, not a shifted Gaussian. The
  # hyperparameters are fitted to tests/fixtures/gold/reconcile/ by
  # scripts/fit_inflation_prior.py and read from this file.
  inflation_priors: config/inflation_priors.yaml

  # What counts as "ancient" for the era fallback. Only reports whose claim
  # regime could not be read from their extracted_context use it. Measured on
  # 2,086 real infobox strength strings, that is about 95% of them, so this
  # fallback is load-bearing rather than incidental.
  ancient_cutoff_year: 500

  # ── sampling ──────────────────────────────────────────────────────────────
  mcmc_samples: 5000                   # neutral fit hit ESS 313 at 2000 on the 211-article corpus; 5000 cleared 400 on the pilot
  mcmc_chains: 4
  mcmc_tune: 1000
  mcmc_target_accept: 0.9
  mcmc_cores: 1                       # >1 respawns the interpreter under pytest on Windows
  random_seed: 20260923               # a re-run must reproduce, not merely converge
  # PyTensor needs g++ to compile its C backend and falls back to Python
  # without one, which puts this model out of reach on a machine with no
  # toolchain. nutpie compiles the logp through numba instead.
  nuts_sampler: nutpie
  likelihood_family: student_t        # 'contaminated' or 'normal' for ablations
  # Under `contaminated` point rows are a two-component Normal mixture (faithful
  # noise plus a wide component, keys below). Kept as an ablation: on the real
  # corpus pi_contam came back at 0.02, so it was not the cause of the collapse.
  # Censored, bound and zero rows stay Normal in every family.
  contamination_pi_alpha: 1.0
  contamination_pi_beta: 9.0
  contamination_sd: 2.0
  # An infobox range ("914,000-1,067,500") is loaded as a lower-bound row and an
  # upper-bound row from one claim. Each censored probability tends to 0.5 as
  # sigma grows, so a pair never pays for a wide sigma and sigma inflated to 1.4,
  # collapsing singletons to the corpus mean. With this on, such a pair becomes
  # one point row at the log midpoint with extra variance (log(B/A)/4)^2. The /4
  # reads the stated range as a central 95% interval (matching the published CI
  # convention); a uniform reading on the log interval would give /sqrt(12),
  # about 15% wider. Off only to reproduce the collapse.
  merge_ranges: true
  ci_mass: 0.95

  # A fit is written to battle_sides only if it clears these. Also recorded in
  # the run's model_runs.config, which neutral_fit_converged reads, so the gate
  # judges the neutral fit by the limits the run applied rather than by numbers
  # fixed in its SQL (a fixture that samples fewer draws lowers them here).
  write_max_rhat: 1.05
  write_min_ess_bulk: 400
  write_max_divergences: 0
  # rhat, ESS and divergences judge the global variables. The side variables
  # (mu_side, z_side) get rhat plus this: the Monte Carlo error of the 2.5%,
  # 50% and 97.5% quantile of mu_side, each at most this share of that side's
  # 95% interval width. Bulk ESS on a one-report side is not the right measure
  # of whether the published quantiles are stable, because a rare second mode
  # (the lone report being the contaminated one) depresses it while the
  # quantiles stay precise.
  write_max_quantile_mcse_frac: 0.05
  # The quantiles checked are ((1-c)/2, 0.5, (1+c)/2) for ci_mass c. The median
  # also has an absolute limit, in log units: a side fails if it breaks either the
  # relative or this one. It stops a very narrow interval from passing the
  # relative test while the median is still visibly noisy.
  write_max_median_mcse_log: 0.05

  # ── gate thresholds (resolved into the quality_checks thresholds below) ────
  min_spread_ratio: 0.25              # estimates_not_collapsed
  min_estimate_coverage: 0.99         # estimates_populated
  max_median_ci_log_width: 4.5        # ci_width_reasonable, LN(hi/lo) on multi-claim sides
  min_singleton_ci_log_width: 0.8     # singleton_estimates_are_honestly_uncertain
  # Widths of mu_side + each side's own row offset, the scale the data identify (diagnostics
  # identified_width). The published-interval gates above carry the shared prior
  # offset and cannot see a fit that dropped its source uncertainty.
  min_singleton_identified_width: 0.8   # singleton_identified_width_is_honest, narrowest singleton
  max_multi_claim_identified_width: 2.2 # multi_claim_identified_width_is_tight, median
  # Prior predictive check on the built model (diagnostics prior_predictive).
  # Draws 0 skips it. The seed is the check's own and leaves the fit's untouched.
  prior_predictive_draws: 500
  prior_predictive_seed: 20261014
  prior_predictive_min_troops: 50
  prior_predictive_max_troops: 5000000
  max_prior_predictive_outside_frac: 0.05   # prior_predictive_is_plausible
  min_calibration_sides: 20           # calibration_set_is_not_empty
  max_low_precision_frac: 0.05        # sides_low_precision

  # ── load-time plausibility (pipeline/reconcilers/plausibility.py) ─────────
  # The extractor defaults branch to 'total', so day numbers, vessel counts and
  # the contingents listed beside a stated total arrive as armies. Values below
  # this are never an army's strength; each exclusion is counted by reason in
  # reconciliation_report.json.
  min_plausible_troops: 100

  # ── hierarchical scales ───────────────────────────────────────────────────
  # A source key gets its own bias and noise terms only if it reports on at
  # least this many distinct battles. On the real corpus every key is one
  # battle's infobox, so a per-key bias is the battle level under another name:
  # it absorbed the side spread and every estimate collapsed to ~35k on a clean
  # convergence. Other keys use their source type's effect and noise scale.
  min_battles_per_source_effect: 3
  source_deviation_prior_sd: 0.5      # tau_u, per-source deviation from its type
  sigma_deviation_prior_sd: 0.3       # tau_sigma
  # tau_u and tau_sigma are learned (HalfNormal) only when at least this many
  # keys carry a deviation; below it they are fixed at the two scales above,
  # since a scale learned from a handful of deviations is the prior again.
  min_keys_for_hierarchical_deviation: 5
  # lineage_prior_sd removed 2026-10-02: copies of one claim are collapsed to
  # one row in build_design, so the model has no lineage term (handover-log 20.10).
  scope_offset_prior_sd: 0.4
  scope_unknown_dispersion_sd: 0.4
  estimate_dispersion_sd: 0.3
  roundness_dispersion_sd: 0.3        # conventional figures are coarsened, not noisy
  casualty_type_offset_prior_sd: 0.7
  # Extra sd (HalfNormal scale) on a casualty component report's log value,
  # because the component-to-total ratio is one corpus constant per component
  # and varies between battles. Troops are unaffected.
  casualty_ratio_dispersion_sd: 0.5

  # How a lone bound ("up to X", "at least X") enters the likelihood. The default
  # 'exgaussian' adds a one-sided exponential excess of mean lambda (HalfNormal,
  # scale below), one lambda per direction shared across sides, so the truth
  # sits a typical distance from the stated figure; it beat 'censored' on both
  # upper and lower bounds in the recovery tests. Its noise is Gaussian, so a
  # mis-extracted bound is absorbed less robustly than a point row (whose noise
  # is Student-t); its scale is matched to the point rows' variance. 'censored'
  # says only that the truth lies on one side and lets the level drift.
  bound_likelihood: exgaussian        # 'censored' or 'exgaussian'
  bound_excess_prior_sd: 0.5

  # ── latent side-strength prior ────────────────────────────────────────────
  # Deliberately not era-structured: era and polity priors belong to the
  # impute stage, and duplicating them here would double-count the same
  # information in two places in the pipeline.
  side_prior_mu: 9.2                  # log troops; e^9.2 ~ 10,000
  side_prior_mu_sd: 1.0
  side_prior_sd_scale: 1.5
  # Degrees of freedom of the Student-t on the standardised side offsets. A
  # Normal side prior against a Student-t likelihood makes the model call a
  # genuinely large side's reports outliers around a typical one (Kursk's
  # 2.5M pulled to ~180k). Fixed, not fitted: 4 is heavy enough to let a side
  # sit 3 sd out, and one dof estimate on ~270 sides would be mostly prior.
  side_prior_nu: 4
  casualty_side_prior_mu: 7.0
  casualty_side_prior_mu_sd: 1.0
  casualty_side_prior_sd_scale: 1.5

  model_type: source_disagreement
  processed_root: data/processed

prompt: null   # this stage is a statistical model, no LLM needed

quality_checks:
  - name: model_convergence
    check: "all rhat < 1.05 and ess_bulk > 400 for all parameters, no divergences"
    method: diagnostics_json
    # The numbers live here, not in the prose above. Parsing the description
    # would make the gate's behaviour depend on English word order.
    params:
      model_type: source_disagreement
      max_rhat: 1.05
      min_ess_bulk: 400
      max_divergences: 0
    severity: error
    description: >
      The sampler converged. Says nothing about whether the data support the
      model -- see calibration_set_is_not_empty for that.

  - name: neutral_fit_converged
    check: >
      SELECT COUNT(*)
      FROM (
        SELECT diagnostics, config
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
      WHERE latest.diagnostics -> 'troops' IS NOT NULL
        AND (
          latest.diagnostics -> 'troops_neutral' IS NULL
          OR COALESCE(
               (latest.diagnostics -> 'troops_neutral' -> 'worst' ->> 'max_rhat')::float,
               'Infinity'::float)
             > COALESCE((latest.config -> 'write_thresholds' ->> 'max_rhat')::float, 1.05)
          OR COALESCE(
               (latest.diagnostics -> 'troops_neutral' -> 'worst' ->> 'min_ess_bulk')::float,
               0::float)
             < COALESCE((latest.config -> 'write_thresholds' ->> 'min_ess_bulk')::float, 400)
          OR COALESCE(
               (latest.diagnostics -> 'troops_neutral' -> 'worst' ->> 'divergences')::float,
               1::float)
             > COALESCE((latest.config -> 'write_thresholds' ->> 'max_divergences')::float, 0)
        )
    threshold: "= 0"
    severity: error
    description: >
      The regime-neutral troops fit converged, on the limits the run applied
      when deciding whether to write (config.write_thresholds, defaulting to
      rhat 1.05, ESS 400, no divergences). A side that fails only its own quantile
      MCSE limit is still written, with a widened interval, and is judged by
      sides_low_precision, not here. When this check fails no est_troops_neutral values and no
      neutral_draws_run file are written for that run, and there is no
      fallback to the published estimates, because the published figures carry
      the unlabelled-regime prior that the neutral fit exists to remove from
      force ratios. Kept apart from model_convergence, which reads the
      published fits only.

  - name: sides_low_precision
    check: >
      SELECT COALESCE((
        SELECT GREATEST(
          COALESCE((latest.diagnostics -> 'troops' ->> 'n_sides_low_precision')::float
                   / NULLIF((latest.diagnostics -> 'troops' ->> 'n_sides')::float, 0), 0::float),
          COALESCE((latest.diagnostics -> 'troops_neutral' ->> 'n_sides_low_precision')::float
                   / NULLIF((latest.diagnostics -> 'troops_neutral' ->> 'n_sides')::float, 0), 0::float),
          COALESCE((latest.diagnostics -> 'casualties' ->> 'n_sides_low_precision')::float
                   / NULLIF((latest.diagnostics -> 'casualties' ->> 'n_sides')::float, 0), 0::float)
        )
        FROM (
          SELECT diagnostics
          FROM model_runs
          WHERE model_type = 'source_disagreement'
            AND completed_at IS NOT NULL
          ORDER BY run_id DESC
          LIMIT 1
        ) latest
      ), 0::float)
    threshold: "<= {params.max_low_precision_frac}"
    severity: error
    description: >
      The share of modelled sides whose own quantile MCSE broke the relative or
      absolute limit stays small. Such a side (typically a singleton whose
      heavy-tailed report conflicts with the heavy-tailed prior, giving a bimodal
      posterior) is still written, with its interval widened by twice the MCSE of
      each bound so the published interval covers the quantile noise; it is listed
      in diagnostics (mcse_failed_side_ids) and in the reconcile_low_precision_sides
      warning, and not in missing_data_log. The worst fraction over troops, the
      neutral troops fit and casualties is read. A high share means the sampler,
      not a few awkward sides, is the problem.

  - name: estimates_not_collapsed
    check: >
      SELECT COALESCE((
        SELECT COALESCE((latest.diagnostics -> 'troops' ->> 'spread_ratio')::float, 1::float)
        FROM (
          SELECT diagnostics
          FROM model_runs
          WHERE model_type = 'source_disagreement'
            AND completed_at IS NOT NULL
          ORDER BY run_id DESC
          LIMIT 1
        ) latest
        WHERE latest.diagnostics -> 'troops' IS NOT NULL
      ), 1::float)
    threshold: ">= {params.min_spread_ratio}"
    severity: error
    description: >
      The estimates keep at least a quarter of the reports' between-side spread
      (spread_ratio: sd across sides of log est_troops_total over sd across sides
      of the mean observed log value). On the pilot corpus a fit that converged
      cleanly gave every side about 35,000, at a ratio near 0.005, because
      per-source terms confounded with battles absorbed the between-side
      variation. No sampler diagnostic sees that. A run whose ratio cannot be
      computed (under two sides, or no point observations) is not failed.

  - name: reports_honoured
    check: >
      SELECT COUNT(*)
      FROM (
        SELECT diagnostics
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
      WHERE latest.diagnostics -> 'troops' IS NOT NULL
        AND COALESCE(
              (latest.diagnostics -> 'troops' -> 'reports_honoured' ->> 'n_violations')::int,
              0) > 0
    threshold: "= 0"
    severity: error
    description: >
      Every side with two or more point reports within a factor of two of each
      other has at least one report inside the credible interval of that row's
      modelled location (mu_side plus the source, regime, scope and era terms
      for that row). A violation means the fit pulled a side away from reports
      that agree with each other, which is what a side prior too tight for large
      sides does and what spread_ratio can miss. The violating side ids, s0, the
      type-level sigma and the observed within-side MAD are in
      model_runs.diagnostics -> troops. spread_ratio stays as the collapse
      backstop.

  - name: estimates_populated
    check: >
      SELECT COUNT(*) FILTER (WHERE bs.est_troops_total IS NOT NULL)::float
           / NULLIF(COUNT(*), 0)
      FROM battle_sides bs
      WHERE EXISTS (SELECT 1 FROM troop_reports tr WHERE tr.side_id = bs.side_id)
      AND NOT EXISTS (
        SELECT 1 FROM missing_data_log mdl
        WHERE mdl.side_id = bs.side_id
          AND mdl.field_name = 'troop_total'
          AND mdl.notes LIKE 'reconcile: %'
          AND mdl.notes NOT LIKE 'reconcile: estimate withheld%'
      )
    threshold: ">= {params.min_estimate_coverage}"
    severity: error
    description: >
      Every side with at least one modellable troop report has an estimate.
      The denominator is every side with a troop report that reconcile did not
      itself log as unfillable (a side logged as "estimate withheld" because
      its fit missed the write thresholds stays in it: that is a failure, not
      an unfillable side), i.e. every side with at least one usable row
      after the load filters (a side whose only report is a cavalry count, a
      non-positive number, a day number or a vessel count is structurally
      un-fillable: est_troops_total is personnel-only and has no per-branch
      column). Counting those sides made the gate permanently red for a reason
      that was not a defect. The narrowing cannot hide a loss:
      unfillable_sides_are_logged counts exactly what it excludes.

  - name: unfillable_sides_are_logged
    check: >
      SELECT COUNT(*)
      FROM battle_sides bs
      WHERE bs.est_troops_total IS NULL
        AND EXISTS (SELECT 1 FROM troop_reports tr WHERE tr.side_id = bs.side_id)
        AND NOT EXISTS (
          SELECT 1 FROM missing_data_log mdl
          WHERE mdl.side_id = bs.side_id AND mdl.field_name = 'troop_total'
        )
    threshold: "= 0"
    severity: error
    description: >
      A side that has reports but no estimate must say why in missing_data_log.
      The stage logs, under the 'reconcile: ' notes prefix, every side with raw
      troop rows it cannot estimate: only naval counts, only non-total branch
      reports, only implausible or non-personnel figures, or no positive value;
      and, for a fit that missed the write thresholds, 'estimate withheld' with
      the run id. The gate and the stage read the same rows.
      The extract stage only logs troop_total when a side has no reports at
      all, so without this reconcile would leave a gap that classify's
      missing_data_all_logged gate then fails on, one stage downstream of the
      cause.

  - name: ci_width_reasonable
    check: >
      SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (
               ORDER BY LN(bs.est_troops_total_hi / bs.est_troops_total_lo)
             )
      FROM battle_sides bs
      WHERE bs.est_troops_method = 'source_disagreement'
        AND bs.est_troops_run_id IS NOT NULL
        AND bs.est_troops_total_lo > 0
        AND bs.est_troops_total_hi > 0
    # Was "< 2.2", which no fit can meet: in a corpus where nearly every
    # report is `unlabelled` (docs/handover-log.md 19.2, 19.9) the unlabelled offset is
    # prior-driven and shared by every side, and its prior sd of ~0.94 alone
    # puts a floor of ~3.7 under LN(hi/lo) (3.3-3.7 across regimes, computed
    # from config/inflation_priors.yaml). Measured 4.13 on the 5-battle seeded
    # test fixture, 2026-09-29, not real data. 4.5 leaves room above that floor to catch a
    # multi-source side whose sources genuinely disagree. Never narrow the
    # intervals to meet this; raise it with a reason instead.
    # Multi-claim sides are picked by est_troops_method, which the stage sets
    # from the claims (lineages) that entered the fit. The first version counted
    # distinct source_id in troop_reports, which is 1 for every side on an
    # infobox-only corpus (one infobox per battle), so the set was empty and the
    # median NULL. A NULL still fails the gate; it now means "no multi-claim
    # side exists to measure", not a mis-specified query.
    threshold: "< {params.max_median_ci_log_width}"
    severity: warning
    description: >
      Median log-scale interval width on multi-claim sides (those the model
      fitted from two or more independent claims). LN(hi/lo) < 4.5
      means the 95% interval spans under a factor of 90, most of which is the
      shared, prior-driven inflation term rather than source disagreement. Measured on the log
      scale because the estimate is a lognormal median and (hi-lo)/est is a
      tail statistic; restricted to multi-claim sides because a singleton's
      interval is legitimately far wider, and filtered on est_troops_run_id so
      an earlier fit's estimates cannot pollute the number.

  - name: singleton_estimates_are_honestly_uncertain
    check: >
      SELECT COALESCE(
        MIN(LN(bs.est_troops_total_hi / bs.est_troops_total_lo)), 1000::float)
      FROM battle_sides bs
      WHERE bs.est_troops_method IN ('single_report_debiased', 'bound_only')
        AND bs.est_troops_run_id IS NOT NULL
        AND bs.est_troops_total_lo > 0
        AND bs.est_troops_total_hi > 0
    threshold: ">= {params.min_singleton_ci_log_width}"
    severity: error
    description: >
      The inverse of ci_width_reasonable, and the more important of the two.
      Reads the narrowest interval among sides fitted from a single claim
      (est_troops_method, not a count of source rows: on an infobox-only corpus
      every side has one source whatever the number of claims).
      A side whose only evidence is one report cannot be known to within a
      factor of 2.2 (LN 0.8): the source's own observation sd alone is around
      0.85. A narrow interval here means the fit dropped either the source
      bias uncertainty or the observation noise, which is the failure that
      makes a wrong ranking look precise.

  - name: singleton_identified_width_is_honest
    check: >
      SELECT COALESCE(
        (latest.diagnostics -> 'troops' -> 'identified_width' -> 'singleton' ->> 'min')::float,
        CASE WHEN (latest.diagnostics -> 'troops' -> 'identified_width' -> 'singleton' ->> 'n')::int = 0
             THEN 1000::float END)
      FROM (
        SELECT diagnostics
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
    threshold: ">= {params.min_singleton_identified_width}"
    severity: error
    description: >
      The narrowest 95% interval, LN(hi/lo), of mu_side plus the side's own row-weighted offset among sides
      fitted from a single claim (est_troops_method single_report_debiased or
      bound_only), read from the newest run's diagnostics. This is the identified
      scale: the published interval adds the shared prior offset, which floors its
      width near 3.7 and hides a fit that dropped the source uncertainty. A NULL
      (no identified_width block) fails; a run with no singletons passes.

  - name: multi_claim_identified_width_is_tight
    check: >
      SELECT (latest.diagnostics -> 'troops' -> 'identified_width' -> 'multi_claim' ->> 'median')::float
      FROM (
        SELECT diagnostics
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
    threshold: "<= {params.max_multi_claim_identified_width}"
    severity: warning
    description: >
      Median LN(hi/lo) of mu_side plus the side's own row-weighted offset over multi-claim sides
      (est_troops_method source_disagreement). Two or more independent claims
      should pin a side tighter than one. A NULL (no multi-claim side, or no
      identified_width block) fails, as ci_width_reasonable does.

  - name: prior_predictive_is_plausible
    check: >
      SELECT CASE
        WHEN (latest.diagnostics -> 'troops' -> 'prior_predictive') ->> 'status' = 'failed' THEN 1::float
        ELSE COALESCE(
          ((latest.diagnostics -> 'troops' -> 'prior_predictive') ->> 'share_outside')::float,
          CASE WHEN (latest.diagnostics -> 'troops' -> 'prior_predictive') ->> 'skipped' IS NOT NULL THEN 0::float END)
      END
      FROM (
        SELECT diagnostics
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
    threshold: "<= {params.max_prior_predictive_outside_frac}"
    severity: warning
    description: >
      Share of prior-predictive troop observations (point rows, 500 draws of the
      built model's own prior) outside [prior_predictive_min_troops,
      prior_predictive_max_troops]. A prior that routinely implies armies of ten
      men or fifty million is doing damage wherever the data are thin. A run that
      disabled the check (prior_predictive_draws 0) passes, with the reason in
      diagnostics.troops.prior_predictive.skipped. A check whose sampler raised
      is recorded as status "failed" with the error and fails this gate, since it
      is not evidence the prior is sensible.

  - name: prior_predictive_neutral_is_plausible
    check: >
      SELECT CASE
        WHEN (latest.diagnostics -> 'troops_neutral' -> 'prior_predictive_neutral') ->> 'status' = 'failed' THEN 1::float
        ELSE COALESCE(
          ((latest.diagnostics -> 'troops_neutral' -> 'prior_predictive_neutral') ->> 'share_outside')::float,
          CASE WHEN (latest.diagnostics -> 'troops_neutral' -> 'prior_predictive_neutral') ->> 'skipped' IS NOT NULL THEN 0::float END)
      END
      FROM (
        SELECT diagnostics
        FROM model_runs
        WHERE model_type = 'source_disagreement'
          AND completed_at IS NOT NULL
        ORDER BY run_id DESC
        LIMIT 1
      ) latest
    threshold: "<= {params.max_prior_predictive_outside_frac}"
    severity: warning
    description: >
      The same check on the regime-neutral fit, which has its own era prior and no
      regime offsets (diagnostics.troops_neutral.prior_predictive_neutral). Disabled
      passes; a sampler failure (status "failed") fails. A run with no neutral block
      has no value and fails, as neutral_fit_converged does.

  - name: calibration_set_is_not_empty
    check: >
      SELECT COUNT(*) FROM (
        SELECT side_id FROM troop_reports
        WHERE branch = 'total' AND reported_value > 0
        GROUP BY side_id
        HAVING COUNT(DISTINCT source_id) >= 2
      ) t
    threshold: ">= {params.min_calibration_sides}"
    severity: warning
    description: >
      Zero is the expected value on an all-infobox corpus: every battle then
      has one infobox source per side, so no side is reported by two sources
      and the gate is correct to warn that the biases are the prior. It
      counts distinct source_id per side on purpose (two claims inside one
      source say nothing about source bias).
      Bias parameters are identified only by sides that two or more sources
      both report. Below this the biases are the prior with extra steps, and
      model_convergence will still pass, because rhat measures the sampler and
      not the evidence.

  - name: neutral_estimates_are_not_stale
    check: >
      SELECT COUNT(*)
      FROM battle_sides bs
      WHERE bs.est_troops_neutral IS NOT NULL
        AND bs.est_troops_neutral_run_id IS DISTINCT FROM (
          SELECT MAX(run_id) FROM model_runs WHERE model_type = 'source_disagreement'
        )
    threshold: "= 0"
    severity: warning
    description: >
      Every neutral estimate comes from the newest source_disagreement run.
      Reads est_troops_neutral_run_id, not est_troops_run_id, because the
      neutral fit is written independently of the published one.

  - name: model_run_recorded
    check: >
      SELECT COUNT(*) FROM model_runs
      WHERE model_type = 'source_disagreement'
        AND completed_at IS NOT NULL
        AND diagnostics IS NOT NULL
    threshold: ">= 1"
    severity: error
    description: "The run recorded its diagnostics, which model_convergence reads."

  - name: estimates_are_not_stale
    check: >
      SELECT COUNT(*)
      FROM battle_sides bs
      WHERE bs.est_troops_total IS NOT NULL
        AND EXISTS (SELECT 1 FROM troop_reports tr WHERE tr.side_id = bs.side_id)
        AND bs.est_troops_run_id IS DISTINCT FROM (
          SELECT MAX(run_id) FROM model_runs WHERE model_type = 'source_disagreement'
        )
    threshold: "= 0"
    severity: warning
    description: >
      Warning rather than error: a manually entered estimate legitimately has
      no run_id. An unexpected non-zero means a partial write left some sides
      on an older fit, which max_stage_retries makes possible.

retry_policy:
  max_stage_retries: 0               # fixed-seed sampling: a re-run repeats the failure
  on_failure: pause_and_alert
