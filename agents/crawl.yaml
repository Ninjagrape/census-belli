stage: crawl
description: >
  Fetch raw HTML and structured data from Wikipedia, Wikidata, DBpedia,
  and cited external sources. Output is raw content; no parsing or
  interpretation happens here.

inputs:
  - config/sources_seed.yaml        # seed URLs: Wikipedia battle list pages
  - data/raw/crawl_state.json       # resume state from previous run (if any)

outputs:
  - data/raw/battles_html/          # one .html per battle article, plus .wikitext
  - data/raw/wikidata/              # one .json per Wikidata entity
  - data/raw/dbpedia/               # one .json per DBpedia resource
  - data/raw/citations/             # fetched citation URLs, keyed by battle
  - data/raw/crawl_state.json       # updated resume state
  - db: crawl_log                   # one row per fetch attempt

tools:
  - httpx_fetch          # async HTTP client with rate limiting and retry
  - robots_check         # check robots.txt before fetching
  - wikidata_sparql      # run SPARQL queries against Wikidata
  - db_insert            # insert rows into crawl_log

params:
  # A live smoke test of ~6 requests at 1.5s spacing drew HTTP 429, so 1.0 was
  # measurably too fast. 2.0 leaves the Retry-After path in fetcher.py as the
  # backstop rather than the normal case.
  rate_limit_wikipedia: 2.0         # seconds between requests to en.wikipedia.org
  rate_limit_other: 2.0             # seconds between requests to other domains
  max_retries: 3
  backoff_base: 2.0
  respect_robots: true
  user_agent: "GeneralWAR/0.1 (academic research; contact@example.com)"
  # Citation hops from a battle article. Only 0 (no citations) and 1 (the
  # allow-listed citations of each article) are implemented; any other value is
  # rejected at param parsing rather than silently behaving as 1.
  citation_depth: 1
  # Fetch each article's wikitext beside its HTML (*.wikitext in battles_html/)
  # from /wiki/<title>?action=raw. robots.txt disallows /w/ and /api/ for all
  # agents but allows /wiki/, so this goes through the robots-checked fetch.
  # Extract prefers the .wikitext sibling when present.
  fetch_wikitext: true
  # Fewest battle articles a list-page crawl must fetch (min_battles_crawled).
  # Not applied to a named corpus (wikipedia_battle_articles with no lists).
  min_battle_articles: 3000
  # Fetch each fetched article's own Wikidata item (Q-id read from the HTML).
  fetch_battle_entities: true
  # only fetch citations from these domains (others are logged but skipped)
  citation_allow_domains:
    - jstor.org
    - doi.org
    - books.google.com
    - archive.org
    - cambridge.org
    - oxford.ac.uk
    - britannica.com

prompt: null  # crawl stage is deterministic, no LLM needed

quality_checks:
  # The first, second and fourth checks read the accounting row that the stage
  # writes at the end of every run (pipeline/stages/crawl.py::_record_plan):
  #   crawl-plan://battle-articles?targets=T&fetched=F&entities=E&floor=N
  # T is the battle articles the run was asked for (named corpus, or discovered
  # from list pages), F how many of them are fetched, E how many of those have
  # their Wikidata item on disk, N the absolute floor (min_battle_articles for a
  # list-page crawl, 0 for a named corpus). The latest row wins, so a re-run
  # that completes the corpus supersedes an earlier partial one. These cannot be
  # derived from per-URL crawl_log rows: a resumed run does not re-log what an
  # earlier run (or an earlier database) already fetched, and citations, list
  # pages and Wikidata payloads all log 200s too (1986 citation rows on the
  # 211-battle pilot satisfied the old "COUNT(DISTINCT url) >= 3000" shape).
  - name: min_battles_crawled
    # Slack above the floor: fetched articles minus the absolute minimum. A
    # list-page crawl needs thousands of battles (floor = params.min_battle_articles)
    # or the lists failed to parse; a named corpus has floor 0 and is judged by
    # the ratio check below.
    check: >
      WITH plan AS (
        SELECT url FROM crawl_log
        WHERE url LIKE 'crawl-plan://battle-articles?%'
        ORDER BY fetched_at DESC, crawl_id DESC LIMIT 1
      )
      SELECT (regexp_match(url, 'fetched=([0-9]+)'))[1]::int
           - (regexp_match(url, 'floor=([0-9]+)'))[1]::int
      FROM plan
    threshold: ">= 0"
    severity: error

  - name: battle_articles_fetched_ratio
    # Passes on a complete named corpus (211/211 = 1.0) and fails when more than
    # 5% of the targeted articles were not fetched, whatever the corpus size.
    check: >
      WITH plan AS (
        SELECT url FROM crawl_log
        WHERE url LIKE 'crawl-plan://battle-articles?%'
        ORDER BY fetched_at DESC, crawl_id DESC LIMIT 1
      )
      SELECT (regexp_match(url, 'fetched=([0-9]+)'))[1]::float
           / NULLIF((regexp_match(url, 'targets=([0-9]+)'))[1]::float, 0)
      FROM plan
    threshold: ">= 0.95"
    severity: error

  - name: error_rate_below_threshold
    check: >
      SELECT COUNT(*) FILTER (WHERE http_status >= 400 OR http_status IS NULL)::float
           / NULLIF(COUNT(*), 0)
      FROM crawl_log
      WHERE url NOT LIKE 'crawl-plan://%'
    threshold: "< 0.10"
    severity: warning

  - name: wikidata_coverage
    # Fraction of fetched battle articles whose own Wikidata item is on disk,
    # so the bar scales with the corpus instead of the old absolute 1000.
    check: >
      WITH plan AS (
        SELECT url FROM crawl_log
        WHERE url LIKE 'crawl-plan://battle-articles?%'
        ORDER BY fetched_at DESC, crawl_id DESC LIMIT 1
      )
      SELECT (regexp_match(url, 'entities=([0-9]+)'))[1]::float
           / NULLIF((regexp_match(url, 'fetched=([0-9]+)'))[1]::float, 0)
      FROM plan
    threshold: ">= 0.9"
    severity: warning

retry_policy:
  max_stage_retries: 2
  retry_on_gate_failure: true       # resumes from crawl_state.json, so a retry makes progress
  on_failure: pause_and_alert
