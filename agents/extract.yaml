stage: extract
description: >
  Parse raw HTML into structured battle records. Infoboxes are parsed
  deterministically. Article body text and external sources use an LLM
  extraction pass to pull troop numbers, commanders, terrain, outcomes,
  and casualty figures that the infobox missed. Wikidata/DBpedia JSON
  is mapped to the schema directly.

inputs:
  - data/raw/battles_html/
  - data/raw/wikidata/
  - data/raw/dbpedia/
  - data/raw/citations/

outputs:
  - data/processed/battles.jsonl
  - data/processed/commanders_raw.jsonl    # pre-resolution commander mentions
  - data/processed/troop_reports.jsonl
  - data/processed/casualty_reports.jsonl
  - db: battles, battle_sides, troop_reports, casualty_reports (partial, pre-resolution)

tools:
  - mwparserfromhell_parse    # deterministic MediaWiki template parser
  - llm_extract               # structured output; offline batch file by default, Anthropic API with llm_mode: api
  - wikidata_map              # map Wikidata JSON fields to schema columns
  - db_upsert

params:
  # This is the highest-volume and lowest-judgement LLM work in the pipeline,
  # one call per passage of a battle article, so it runs on Haiku.
  #
  # Offline-first: with llm_mode 'offline' an uncached passage is written to
  # data/llm_requests/ and the pipeline stops after this stage. Answer the
  # file with /process-llm-batch (Claude Code subagents, under the
  # subscription), then re-run the stage. 'api' sends the same requests to
  # the Anthropic API instead. Both use the provider and model below, so the
  # request hash is identical and the llm_calls cache is shared between modes.
  # Haiku 5.5 rejects sampling parameters, so there is no llm_temperature.
  llm_provider: anthropic
  llm_model: claude-haiku-5-5
  llm_mode: offline
  llm_max_tokens: 4096
  batch_size: 50               # process this many articles per LLM batch

  # Targeted outcome request, one per battle whose winner the deterministic
  # merge could not read (see outcome_prompt below). It is a judgement
  # about who won from a short, bounded text, so it runs on Sonnet rather than
  # the passage model above. Same offline-first rules, but its uncached
  # requests go to their own batch file, data/llm_requests/extract_outcome_<ts>.jsonl,
  # so the large passage file never has to be answered to get outcomes.
  # Remove outcome_llm_model to switch the pass off.
  outcome_llm_model: claude-sonnet-5-5
  outcome_llm_max_tokens: 1024

prompt:
  system: |
    You are a military history data extraction assistant. Given a passage from
    a battle article or an external source about a battle, extract structured
    data into the JSON schema below.

    Be conservative: only extract values explicitly stated in the text. If a
    number is described as approximate ("about 30,000", "roughly 20,000"),
    set is_estimate to true. If the text gives a range ("between 15,000 and
    20,000"), extract both as separate reports with is_lower_bound and
    is_upper_bound flags respectively.

    Pay close attention to SCOPE: does the number refer to troops actually
    engaged in this battle, total forces available in the theatre, or
    nominal/on-paper strength? This distinction is critical and sources
    often conflate them.

    For commanders, extract every named person described as commanding,
    leading, or directing forces. Note their apparent role: did they
    command the whole army, a wing/division, a fleet, or were they present
    in a political/sovereign capacity? Quote the key sentence supporting
    your role classification in role_evidence.

    For terrain, extract any mentions of geography, fortifications, weather,
    or defensive positions.

  output_schema:
    type: object
    properties:
      battle_name:
        type: string
      commanders:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            side:
              type: string
            apparent_role:
              type: string
              enum: [sovereign, supreme_commander, theatre_commander, field_commander, subordinate, nominal, unclear]
            role_evidence:
              type: string
              description: "Direct quote from the text supporting the role classification"
          required: [name, side, apparent_role]
      troop_reports:
        type: array
        items:
          type: object
          properties:
            side:
              type: string
            branch:
              type: string
              enum: [total, infantry, cavalry, artillery, naval, air, armour, irregular, other]
            value:
              type: number
            scope:
              type: string
              enum: [engaged, available, theatre_strength, on_paper, unknown]
            is_estimate:
              type: boolean
            is_upper_bound:
              type: boolean
            is_lower_bound:
              type: boolean
            context_quote:
              type: string
          required: [side, branch, value, scope]
      casualty_reports:
        type: array
        items:
          type: object
          properties:
            side:
              type: string
            casualty_type:
              type: string
              enum: [killed, wounded, captured, missing, total]
            value:
              type: number
            is_estimate:
              type: boolean
          required: [side, casualty_type, value]
      terrain:
        type: array
        items:
          type: string
      fortified:
        type: boolean
      weather:
        type: string
      outcome:
        type: object
        properties:
          victor:
            type: string
          outcome_level:
            type: string
            enum: [decisive_victory, victory, pyrrhic_victory, indecisive]
          evidence:
            type: string
    required: [battle_name]

  user_template: |
    Battle: {battle_name}
    Source: {source_type} ({source_title})
    ---
    {text_passage}
    ---
    Extract all structured data from this passage. Return ONLY valid JSON matching the schema. If a field has no information in this passage, omit it.

outcome_prompt:
  system: |
    You decide which side won a battle, using only the text you are given.

    You receive the battle's title, the result line from its infobox, the
    sides in the order the infobox lists them (each with its belligerents and
    commanders) and an excerpt from the start of the article. Choose the side
    that won, and quote the words that tell you so.

    Rules:
    - winner must be one of the side labels exactly as written after "Side N:",
      or the word "indecisive" if the text calls the battle a draw, a stalemate
      or inconclusive, or the word "unclear" if the text does not settle it.
    - Decide from the result line first, then the excerpt. Do not use what you
      remember about the battle. If the text does not say, answer "unclear".
    - A coalition, alliance or nationality named in the result ("Allied
      victory", "Prussian victory") points at the side whose belligerents or
      commanders include it. If it fits more than one side, answer "unclear".
    - A victory that is only tactical, pyrrhic or local still has a winner.
    - evidence is a short quote copied from the text, or an empty string when
      the winner is "unclear".

  output_schema:
    type: object
    properties:
      winner:
        type: string
      evidence:
        type: string
    required: [winner, evidence]
    additionalProperties: false

  user_template: |
    Battle: {battle_name}
    Infobox result: {infobox_result}
    {sides}
    Article excerpt (the first {lead_chars} characters at most):
    ---
    {lead_excerpt}
    ---
    Return ONLY valid JSON matching the schema.

quality_checks:
  - name: extraction_coverage
    check: >
      SELECT COUNT(*) FILTER (WHERE n_sources > 0)::float / NULLIF(COUNT(*), 0)
      FROM battles
    threshold: ">= 0.85"
    severity: warning

  - name: sides_per_battle
    # This gate used to count battle_commanders. That table has a NOT NULL
    # general_id and the extract stage writes no rows to it -- commander
    # mentions wait in data/processed/commanders_raw.jsonl until resolve has
    # canonical generals to point at -- so the gate could only ever report 0
    # here. It now measures battle_sides, which extract does write, and the
    # commanders-per-battle version lives in agents/resolve.yaml.
    check: >
      SELECT AVG(side_count) FROM (
        SELECT b.battle_id, COUNT(s.side_id) AS side_count
        FROM battles b
        LEFT JOIN battle_sides s ON s.battle_id = b.battle_id
        GROUP BY b.battle_id
      ) t
    threshold: ">= 2.0"
    severity: warning
    description: "A battle has at least two sides; fewer means the infobox parse thinned it"

  - name: no_empty_extractions
    # This gate used to read crawl_log.extraction_method / fields_extracted,
    # which no stage writes, so it counted zero rows whatever extract did. It
    # now measures what extract writes: a battle with neither a start date
    # nor a single side is a record the parse produced nothing for. A few
    # such articles are normal (a list page, a stub); a large share means the
    # infobox parser, the article format or the database write broke. An
    # empty battles table reads as 1.0 and fails.
    check: >
      SELECT COALESCE(
        COUNT(*) FILTER (
          WHERE b.date_start IS NULL
            AND NOT EXISTS (SELECT 1 FROM battle_sides s WHERE s.battle_id = b.battle_id)
        )::float / NULLIF(COUNT(*), 0),
        1.0
      )
      FROM battles b
    threshold: "< 0.05"
    severity: warning
    description: "Share of battles with no date and no sides; the pilot corpus measured 0.0065"

retry_policy:
  max_stage_retries: 3
  on_failure: continue_with_logging    # don't block the whole pipeline on one article
