stage: classify
description: >
  Two classification tasks in one stage.
  (A) For each battle-commander pair, determine the command_role,
      hierarchy_rank, reports_to relationship, and initial attribution_weight
      using extracted role_evidence and article context.
  (B) For each missing data field, classify the missingness mechanism
      (MCAR, MAR, MNAR) to inform the imputation strategy.

inputs:
  - db: battle_commanders (with general_id resolved)
  - db: battles, battle_sides
  - data/raw/battles_html/       # re-read article text for context
  - data/processed/troop_reports.jsonl

outputs:
  - db: battle_commanders (command_role, hierarchy_rank, reports_to_bc_id, attribution_weight updated)
  - db: battles (battle_type, fortified, terrain; campaign may replace a rule-derived type)
  - db: battle_sides (is_defender, from a siege title first, then the role answer, only where NULL)
  - db: missing_data_log (classes; also adds a troop_total row for any side with no estimate and no row)

tools:
  - llm_classify
  - db_update
  - db_insert

params:
  # This stage stays on Anthropic deliberately. Command attribution is the
  # Octavian/Agrippa problem, the judgement the whole WAR methodology rests
  # on, and it is the wrong place to economise: it is also far lower volume
  # than extract, since only multi-commander sides need a call at all.
  #
  # Sonnet 5.5 rejects sampling parameters outright, so there is no
  # llm_temperature: determinism comes from the structured output constraint.
  # Its answers differ from the earlier claude-sonnet-4-6 ones, and the model
  # is part of the request hash, so a corpus classified under the old model
  # is re-requested rather than silently reused.
  llm_provider: anthropic
  llm_model: claude-sonnet-5-5

  # Stage wiring (added when the stage runner was built; the prompts and
  # gates above are unchanged).
  #
  # 'offline' looks up each pending side's command-role request in llm_calls
  # by its exact hash and applies a cached answer; every miss is written to
  # data/llm_requests/ for /process-llm-batch (Claude Code subagents, under
  # the subscription) and the pipeline stops after this stage. No API client
  # is built. 'api' sends the request live using the provider and model
  # above; the hash is the same, so the cache is shared between modes.
  # See pipeline/stages/classify.py.
  llm_mode: offline
  processed_root: data/processed
  raw_root: data/raw
  # Character budget for the article excerpt sent with a command-role
  # request; see pipeline.classifiers.requests.select_excerpt.
  excerpt_max_chars: 6000
  # Output ceiling for one missingness request (a type and one sentence).
  missingness_max_tokens: 512

  # battle_type notes, kept here because the enum has members this stage
  # deliberately does not produce:
  # - campaign: a title naming a war or campaign without battle/siege/raid, or
  #   (other than a "Battle of"/"Siege of" title) dates spanning more than 180 days at day precision. It wins over every
  #   other type, and is the one type allowed to replace a rule-derived type
  #   (found through battles.battle_type_source = 'classify').
  #   The model excludes campaigns.
  # - siege_defensive is never produced. Which side was besieged is
  #   battle_sides.is_defender, per side; a second article-level value would
  #   only repeat it. A siege is written siege_offensive + fortified.
  # - combined is never produced: no clean rule separates it from the others.
  # - amphibious and guerrilla only on strong signals (see battle_type.py).

# ──── TASK A: COMMAND ROLE CLASSIFICATION ────────────────────────────────────

command_role_prompt:
  system: |
    You are a military history analyst classifying command relationships.
    Given a battle and its listed commanders on one side, determine:

    1. Each commander's ROLE from this list:
       - sovereign: head of state/monarch present but not directing tactics
       - supreme_commander: overall strategic authority, may not direct the battle
       - theatre_commander: commands the campaign, directs overall battle plan
       - field_commander: directly commands the army/fleet/force in the engagement
       - subordinate: commands a wing, division, corps, or squadron under another
       - nominal: listed for political reasons, did not meaningfully command

    2. The HIERARCHY: who reported to whom in this specific battle. The top
       tactical commander (the field_commander) has hierarchy_rank 0. Their
       direct reports have rank 1, and so on. A sovereign or supreme
       commander who did not direct the battle is rank 1, not 0.

    3. An ATTRIBUTION WEIGHT (0.0 to 1.0) estimating how much of the
       tactical outcome should be credited to this person. Weights for all
       commanders on a side should sum to approximately 1.0. A field
       commander who planned and executed the battle gets most of the weight.
       A sovereign who was merely present gets 0.05-0.15. A subordinate
       who commanded a crucial wing might get 0.2-0.4.

    Base your classification on the article text provided. If the text does
    not give enough information to distinguish roles, default to:
    - If only one commander is listed: field_commander, weight 1.0
    - If two or more are listed with no further context: split the weight
      equally (1/n each), role "unknown", low confidence. Do not rank by
      the order the names are listed in or by title: the listing order
      favours heads of state over the officer who actually commanded.
    - Flag these for manual review

    Output rules:
    - Every commander listed must appear in the output exactly once, with
      the name copied exactly as given in the input. Do not omit anyone,
      merge two people, shorten, translate or re-spell a name, and do not
      add anyone who was not listed.
    - Exactly one commander has hierarchy_rank 0, unless two or more are
      co-field_commanders, who all have rank 0. Everyone else has rank 1 or
      higher. "reports_to" must be the exact name of another listed
      commander on this side, or null, and must never form a loop.
    - Weights must sum to 1.0 across the side.

    Listing order and unresolved names: commanders are numbered "#1", "#2"
    in the order the article's infobox gives them (no number means the
    position is not recorded). The order is evidence about the infobox, not
    about command: infoboxes list heads of state and senior names first, so
    never rank or weight by position. The user message also says how many
    further commanders the infobox named that could not be identified. When
    that number is above zero, the listed people are not the whole command
    team; still give weights across the listed commanders only (summing to
    1.0), and lower your confidence if the missing names could have mattered.

    Defender: also say whether this side was the DEFENDER ("is_defender"):
    true when it held the position (a fortress, city, walled camp, ridge,
    river line or other prepared ground) that the other side attacked;
    false when it was the side attacking such a position; null for a meeting
    engagement, a fluid battle, or when the text does not say. Do not infer
    it from who won or from infobox order.

    Not a person: if a listed commander is not an individual (for example
    "Army Group B", "1st Ukrainian Front", a title or a formation), return
    command_role "unknown", attribution_weight 0, hierarchy_rank 1,
    reports_to null, and say "not_a_person" in the reasoning. Give the
    weight to the people instead.

    Specific patterns to watch for:
    - A monarch "present at" or "accompanied" the army but a named general
      "commanded" or "led" = sovereign + field_commander
    - "X commanded the left/right wing under Y" = subordinate reports to Y
    - "X directed the battle while Y remained at camp/on shore/in reserve"
      = X is field_commander, Y is nominal or sovereign
    - No one commands in the field but one officer directed the battle from a
      staff or headquarters post: give that officer theatre_commander and
      rank 0, and the sovereign and army commanders rank 1 (see Königgrätz
      below), but only when that officer held documented delegated command
      authority over the armies. A chief of staff who planned and advised
      without such authority (Ludendorff at Tannenberg, Eisenhower's staff)
      is not pulled to rank 0 by default; rank the commander who issued the
      orders.
    - Roman consuls who alternated daily command, or any co-equal consuls:
      both are rank-0 co-field_commanders with equal weight, as with any
      co-field_commanders. Never mark the other consul subordinate or
      nominal because of a day-command tradition (Varro commanding on the
      day of Cannae is contested in the sources), unless the article states
      that one consul formally yielded command.

    Worked examples (illustrations of the reasoning; the facts are for the
    battles named, not for the one you are asked about):

    Battle of Actium (31 BC), side of Octavian. Listed: Marcus Vipsanius Agrippa, Octavian.
    Answer: {"classifications": [
      {"name": "Marcus Vipsanius Agrippa", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.85, "confidence": 0.9, "reasoning": "Agrippa was the admiral who handled the fleet in the battle; Octavian held overall authority but did not direct the fleet action"},
      {"name": "Octavian", "command_role": "supreme_commander", "hierarchy_rank": 1, "reports_to": null, "attribution_weight": 0.15, "confidence": 0.85, "reasoning": "overall political and strategic authority, aboard the fleet but not directing the manoeuvres"}],
     "is_defender": null}

    Battle of Munda (45 BC), side of Caesar. Listed: Julius Caesar, Quintus Fabius Maximus, Quintus Pedius.
    Answer: {"classifications": [
      {"name": "Julius Caesar", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.9, "confidence": 0.5, "reasoning": "Caesar took personal command and rallied the line when it wavered"},
      {"name": "Quintus Fabius Maximus", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Julius Caesar", "attribution_weight": 0.05, "confidence": 0.3, "reasoning": "present in theatre, not attested in the battle"},
      {"name": "Quintus Pedius", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Julius Caesar", "attribution_weight": 0.05, "confidence": 0.3, "reasoning": "present in theatre, not attested in the battle"}],
     "is_defender": false}

    Battle of Mutina (43 BC), 21 April, Senate's side (a relief army mixed with a besieged garrison, so is_defender is null). Listed: Aulus Hirtius, Octavian, Decimus Junius Brutus Albinus.
    Answer: {"classifications": [
      {"name": "Aulus Hirtius", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.5, "confidence": 0.65, "reasoning": "consul with imperium, commanded the relief army and fell in the assault on the besiegers' camp"},
      {"name": "Octavian", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Aulus Hirtius", "attribution_weight": 0.3, "confidence": 0.6, "reasoning": "young propraetor leading his own legions beside the consul, junior to him"},
      {"name": "Decimus Junius Brutus Albinus", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": null, "attribution_weight": 0.2, "confidence": 0.55, "reasoning": "commanded the besieged garrison whose sortie joined the fight; not under Hirtius' orders"}],
     "is_defender": null}

    Battle of Chaeronea (338 BC), Macedonian side. Listed: Philip II of Macedon, Alexander the Great.
    Answer: {"classifications": [
      {"name": "Philip II of Macedon", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.65, "confidence": 0.85, "reasoning": "the king commanded one wing in person and directed the whole battle plan"},
      {"name": "Alexander the Great", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Philip II of Macedon", "attribution_weight": 0.35, "confidence": 0.8, "reasoning": "led the cavalry on the other wing under his father and broke the Theban Sacred Band"}],
     "is_defender": false}

    Battle of Salamis (480 BC), Greek fleet. Listed: Eurybiades, Themistocles.
    Answer: {"classifications": [
      {"name": "Themistocles", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.6, "confidence": 0.65, "reasoning": "pressed for the battle in the narrows and shaped the plan; contributed the largest squadron. De facto direction is contested in the sources"},
      {"name": "Eurybiades", "command_role": "supreme_commander", "hierarchy_rank": 1, "reports_to": null, "attribution_weight": 0.4, "confidence": 0.65, "reasoning": "Spartan holding the formal command of the allied fleet, whose decisions followed a council Themistocles influenced"}],
     "is_defender": null}

    Battle of Mohi (1241), Mongol side. Listed: Batu Khan, Subutai.
    Answer: {"classifications": [
      {"name": "Subutai", "command_role": "field_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.65, "confidence": 0.6, "reasoning": "the strategist who drew up the crossing plan and led the flanking force"},
      {"name": "Batu Khan", "command_role": "supreme_commander", "hierarchy_rank": 1, "reports_to": null, "attribution_weight": 0.35, "confidence": 0.6, "reasoning": "titular commander of the western invasion; led the assault on the Sajo bridge. The sources split on credit: the Yuan Shi favours Subutai, Plano Carpini names Batu"}],
     "is_defender": false}

    Battle of Königgrätz (1866), Prussian side. Listed: Wilhelm I, Helmuth von Moltke, Prince Frederick Charles, Crown Prince Frederick William, Karl Eberhard Herwarth von Bittenfeld.
    Answer: {"classifications": [
      {"name": "Helmuth von Moltke", "command_role": "theatre_commander", "hierarchy_rank": 0, "reports_to": null, "attribution_weight": 0.43, "confidence": 0.8, "reasoning": "as chief of the general staff he directed the converging advance and the decision to fight, so he holds rank 0 though no field command"},
      {"name": "Wilhelm I", "command_role": "sovereign", "hierarchy_rank": 1, "reports_to": null, "attribution_weight": 0.05, "confidence": 0.9, "reasoning": "the king was present and held nominal supreme command"},
      {"name": "Prince Frederick Charles", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Helmuth von Moltke", "attribution_weight": 0.22, "confidence": 0.8, "reasoning": "First Army, held the frontal fight"},
      {"name": "Crown Prince Frederick William", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Helmuth von Moltke", "attribution_weight": 0.22, "confidence": 0.8, "reasoning": "Second Army, whose flank attack decided the battle"},
      {"name": "Karl Eberhard Herwarth von Bittenfeld", "command_role": "subordinate", "hierarchy_rank": 1, "reports_to": "Helmuth von Moltke", "attribution_weight": 0.08, "confidence": 0.7, "reasoning": "Elbe Army, the smaller force on the right of the line"}],
     "is_defender": false}

  user_template: |
    Battle: {battle_name} ({date})
    Side: {side_label}

    Commanders listed (infobox order where numbered):
    {commanders_formatted}

    Commanders named in the infobox but not identified: {unresolved_formatted}

    Extracted role evidence:
    {role_evidence_formatted}

    Full article excerpt (relevant sections):
    {article_excerpt}

    Classify each commander. Return JSON:
    {{
      "classifications": [
        {{
          "name": "...",
          "command_role": "...",
          "hierarchy_rank": 0,
          "reports_to": null or "name of superior",
          "attribution_weight": 0.0-1.0,
          "confidence": 0.0-1.0,
          "reasoning": "..."
        }}
      ],
      "is_defender": true/false/null,
      "needs_review": true/false,
      "review_reason": "..." or null
    }}

# ──── TASK B: MISSINGNESS CLASSIFICATION ─────────────────────────────────────

missingness_prompt:
  system: |
    You are a statistician classifying missing data mechanisms in a historical
    military dataset. For each missing field, determine whether the data is:

    - MCAR (Missing Completely At Random): the probability of being missing
      is unrelated to any observed or unobserved data. Example: a Wikipedia
      editor simply hasn't gotten around to adding a troop number that
      exists in accessible sources.

    - MAR (Missing At Random): the probability of being missing depends on
      observed variables but not on the missing value itself. Example:
      battles from smaller conflicts tend to have less documentation, so
      troop numbers are missing, but the missingness depends on "conflict
      size" (observed) not on the troop numbers themselves.

    - MNAR (Missing Not At Random): the probability of being missing
      depends on the unobserved value itself. Example: troop numbers for
      embarrassing defeats may be suppressed by the losing side's historians,
      so the missingness depends on the outcome (partially observed) and
      the magnitude of the defeat (related to the troop numbers themselves).

    Use these heuristics:
    - Ancient/medieval battles with no troop data at all: likely MNAR
      (records lost because the battle was obscure, and obscurity correlates
      with small scale)
    - 18th-19th century European battles missing one side's numbers: likely
      MAR (depends on which side kept better records)
    - Modern battles missing air/naval breakdown: likely MCAR (infobox
      template inconsistency)
    - Battles where only the winner's numbers are known: likely MNAR
      (losers' records destroyed or suppressed)
    - Casualties missing although the side's strength is known is a different
      mechanism from a missing troop total: a defeated side's heaviest losses
      are the figures most often left unrecorded (MNAR), while a victor's
      follow era and how well the battle is written up (MAR)
    - After 1914, figures missing for a side of an authoritarian wartime state
      (the Soviet Union, Nazi Germany, Imperial Japan and similar) are MNAR:
      the state suppressed or distorted its own strength and loss figures

    The deterministic rules have already settled the cases above that have a
    clean test. You are asked only about the rows they could not settle, so
    weigh the evidence given and do not assume a pattern the facts do not
    show. Prefer MAR over MCAR when the gap plausibly tracks documentation,
    and choose MNAR only when the value itself plausibly caused the gap.
    The "reason" is one sentence naming the evidence.

  user_template: |
    Battle: {battle_name} ({date}, {war}, {region})
    Era: {era}
    Missing field: {field_name}
    What IS known about this battle:
    {observed_fields_summary}

    Classify the missingness mechanism. Return JSON:
    {{"missingness_type": "mcar|mar|mnar", "reason": "..."}}

quality_checks:
  - name: all_commanders_classified
    check: >
      SELECT COUNT(*) FROM battle_commanders
      WHERE command_role = 'unknown'
    threshold: "< 200"
    severity: warning
    description: "Fewer than 200 commanders should remain unclassified"

  - name: attribution_weights_sum
    check: >
      SELECT COUNT(*) FROM (
        SELECT side_id, ABS(SUM(attribution_weight) - 1.0) as deviation
        FROM battle_commanders
        GROUP BY side_id
        HAVING ABS(SUM(attribution_weight) - 1.0) > 0.15
      ) t
    threshold: "< 50"
    severity: warning
    description: "Attribution weights per side should sum close to 1.0"

  # A proportion of the battles that have an article, not a count of the
  # corpus: the corpus grows by orders of magnitude and a fixed count means
  # nothing at 100 or 10,000 battles. An article that was read always yields at
  # least 'field', so an 'unknown' with a source_slug is a file that went missing
  # or would not parse. A corpus with no articles passes (nothing to measure).
  - name: battle_type_unknown_share
    check: >
      SELECT COALESCE(
        COUNT(*) FILTER (WHERE battle_type = 'unknown')::float
          / NULLIF(COUNT(*), 0),
        0)
      FROM battles
      WHERE source_slug IS NOT NULL
    threshold: "< 0.10"
    severity: warning
    description: "Under 10% of battles with an article should still be typed unknown"

  - name: missing_data_all_logged
    check: >
      SELECT COUNT(*) FROM battle_sides bs
      WHERE bs.est_troops_total IS NULL
        AND NOT EXISTS (
          SELECT 1 FROM missing_data_log mdl
          WHERE mdl.side_id = bs.side_id AND mdl.field_name = 'troop_total'
        )
    threshold: "= 0"
    severity: error
    description: "Every missing troop total must have a missing_data_log entry"

retry_policy:
  max_stage_retries: 2
  on_failure: continue_with_logging
