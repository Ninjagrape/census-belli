stage: resolve
description: >
  Entity resolution for commanders and battles. Link every extracted
  commander mention to a canonical general_id (backed by a Wikidata entity
  where possible). Merge duplicate battle records. Build the general_aliases
  table. This stage uses a hybrid approach: deterministic matching first,
  then LLM-assisted disambiguation for ambiguous cases.

inputs:
  - data/processed/commanders_raw.jsonl
  - data/processed/battles.jsonl
  - data/raw/wikidata/

outputs:
  - db: generals, general_aliases, battle_commanders (general_id populated)
  - data/processed/resolution_log.jsonl    # audit trail of every merge/link decision

tools:
  - wikidata_sparql
  - llm_disambiguate
  - db_upsert
  - fuzzy_match               # rapidfuzz for string similarity

params:
  fuzzy_threshold: 85          # minimum similarity score for candidate matches
  # How far the best candidate must beat the runner-up to be accepted without
  # asking the LLM. Two entities scoring within this of each other are
  # usually a father and a son.
  ambiguity_margin: 6

  # Where candidates come from: 'sparql' queries the live Wikidata endpoint,
  # 'local' indexes the entity JSON already under data/raw/wikidata, 'none'
  # resolves everything as a new entity. 'local' and 'none' need no network.
  candidate_source: sparql
  sparql_batch_size: 25        # names per query; the endpoint times out on large ones
  max_names_per_group: 3       # surface forms of one person to ask about
  # Fallback for names the exact lookup could not place: a ranked search that
  # finds "Emmanuel de Grouchy, Marquis de Grouchy" for "Emmanuel de Grouchy".
  # Hits are candidates only; threshold, date gate and margin still decide.
  search_names_per_group: 2
  search_batch_size: 10
  # Era bins for generals.era, shared with the impute stage so a general's era
  # and a battle's era mean the same thing.
  imputation_priors: config/imputation_priors.yaml
  rate_limit_sparql: 2.0       # seconds between queries; stricter than the article API
  respect_robots: true

  # Duplicate battle detection. The stage reports suspected pairs to
  # data/processed/duplicate_battles.jsonl and never merges them: merging two
  # battle rows re-parents their sides, troop reports and commanders, and a
  # wrong merge destroys the outcome data the model is fitted to.
  battle_duplicate_threshold: 92    # name similarity, after "Battle of" is stripped
  battle_duplicate_year_slack: 1    # years apart two records of one battle may be

  processed_root: data/processed
  raw_root: data/raw

  # Most resolution is SPARQL plus rapidfuzz; the LLM only breaks ties the
  # fuzzy matcher leaves ambiguous, so the judgement asked of it is narrow
  # and well bounded and Haiku is enough.
  #
  # Offline-first: with llm_mode 'offline' an uncached request is written to
  # data/llm_requests/ and the pipeline stops after this stage. Answer the
  # file with /process-llm-batch (Claude Code subagents, under the
  # subscription), then re-run the stage. 'api' sends the same requests to
  # the Anthropic API instead. Both use the provider and model below, so the
  # request hash is identical and the llm_calls cache is shared between modes.
  # Haiku 5.5 rejects sampling parameters, so there is no llm_temperature.
  llm_provider: anthropic
  llm_model: claude-haiku-5-5
  llm_mode: offline

steps:
  # Step 1: deterministic — exact name match to Wikidata
  - name: exact_wikidata_match
    method: deterministic
    description: >
      For each unique commander name, query Wikidata for entities with
      matching labels that are instances of "human" (Q5) and have
      "military commander" (Q47064) or similar occupation. Exact matches
      on the English label get linked automatically.

  # Step 2: deterministic — fuzzy match + context
  - name: fuzzy_contextual_match
    method: deterministic
    description: >
      For unresolved names, run fuzzy matching against the generals table
      and Wikidata candidates. Candidates must share at least one battle's
      war/era/polity to be considered. Matches above the fuzzy_threshold
      with matching context are linked automatically.

  # Step 3: LLM-assisted — true ambiguity
  - name: llm_disambiguation
    method: llm
    description: >
      For remaining unresolved names (typically <5% of total), present
      the LLM with the commander mention, its battle context, and the
      top candidate entities. Ask it to choose or flag as genuinely new.

prompt:
  system: |
    You are a military history entity resolution assistant. Given a
    commander name extracted from a battle article and a list of candidate
    Wikidata entities, determine which candidate (if any) is the correct
    match. Consider:
    - The time period and region of the battle
    - The side/polity the commander fought for
    - The commander's described rank or role
    - Alternative name spellings, transliterations, regnal numbers

    If none of the candidates match, respond with "NEW_ENTITY" and provide
    the best canonical name. If the match is uncertain, respond with
    "UNCERTAIN" and your best guess with a confidence score.

  # Rendered by render_template (regex on {word}), not str.format, so literal
  # braces are written as single braces. Doubling them leaks into the prompt.
  user_template: |
    Commander mention: "{name}"
    Battle: {battle_name} ({date}, {war})
    Side: {side_label}
    Role described: {apparent_role}
    Context: "{role_evidence}"

    Candidates:
    {candidates_formatted}

    Which candidate matches this commander? Respond with JSON:
    {"match": "<wikidata_id or NEW_ENTITY or UNCERTAIN>", "confidence": 0.0-1.0, "reasoning": "..."}

  # The stage loads this at run time and hands it to the LLM layer, which
  # validates every response against it. A Q-id cannot be constrained to the
  # candidates actually offered, so the stage checks that separately and
  # treats an unoffered id as a refusal to match.
  output_schema:
    type: object
    required: [match, confidence]
    properties:
      match:
        type: string
        description: "A Wikidata Q-id, or NEW_ENTITY, or UNCERTAIN"
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0
      reasoning:
        type: string

quality_checks:
  - name: resolution_rate
    # battle_commanders.general_id is NOT NULL, so counting non-null ids in
    # that table divides written rows by written rows and reports 1.0 however
    # many mentions the stage lost. The real denominator is written rows plus
    # the mentions resolve could not place, which it records in
    # missing_data_log under commander_general_id: groups left unresolved, and
    # mentions of resolved people whose side is not in the database. Refused
    # non-persons (field commander_non_person) are outside it on purpose.
    #
    # Two known blind spots. A mention whose battle row is absent cannot be
    # logged there (battle_id is NOT NULL); resolve warns and writes it to
    # data/processed/unplaced_mentions.jsonl. And the extract stage deletes
    # every un-imputed missing_data_log row of a battle it rewrites, so an
    # extract re-run after resolve empties the denominator and this reads 1.0
    # until resolve is run again.
    check: >
      SELECT (SELECT COUNT(*) FROM battle_commanders)::float
           / NULLIF(
               (SELECT COUNT(*) FROM battle_commanders)
             + (SELECT COUNT(*) FROM missing_data_log
                 WHERE field_name = 'commander_general_id'), 0)
    threshold: ">= 0.90"
    severity: warning
    description: "At least 90% of commander mentions should reach battle_commanders"

  - name: no_duplicate_generals
    # generals.wikidata_id is UNIQUE, so counting duplicate Q-ids can never
    # fail; the gate that was here measured the schema, not the stage. The real
    # duplicate is a corpus-local general (no Q-id) that is the same person as
    # another row: the same name once folded for case, accents and punctuation,
    # with battle years that overlap (or no years to compare), where at least
    # one of the pair has no Wikidata id. A pair where both carry different
    # Q-ids is two people Wikidata already told apart.
    #
    # One deliberate split is excluded: a corpus-local row whose notes carry
    # "kept separate after an uncertain match" (records.UNCERTAIN_SPLIT_NOTE) is
    # a person the LLM answered UNCERTAIN about, set apart from a Wikidata
    # namesake on purpose (handover 9.3, prefer a split to a merge). Such a pair
    # is counted by probable_duplicate_generals instead. Two corpus-local rows,
    # or a corpus-local row with no such note, still fail here.
    #
    # Only generals with at least one battle_commanders row are counted.
    # remove_orphan_generals keeps a general that earlier model runs still
    # reference (general_skill_estimates, battle_war_details) even after resolve
    # stops linking them, e.g. one the lifespan gate now rejects. That row is
    # history, not a live duplicate, and counted against its corpus-local
    # replacement it failed the gate for a split resolve had already made.
    check: >
      SELECT COUNT(*) FROM generals a
      JOIN generals b ON a.general_id < b.general_id
       AND regexp_replace(translate(lower(a.canonical_name),
             'àáâãäåçèéêëìíîïñòóôõöùúûüýÿšžłø', 'aaaaaaceeeeiiiinooooouuuuyyszlo'),
             '[^a-z0-9]+', '', 'g')
         = regexp_replace(translate(lower(b.canonical_name),
             'àáâãäåçèéêëìíîïñòóôõöùúûüýÿšžłø', 'aaaaaaceeeeiiiinooooouuuuyyszlo'),
             '[^a-z0-9]+', '', 'g')
      WHERE (a.wikidata_id IS NULL OR b.wikidata_id IS NULL)
        AND EXISTS (SELECT 1 FROM battle_commanders bc WHERE bc.general_id = a.general_id)
        AND EXISTS (SELECT 1 FROM battle_commanders bc WHERE bc.general_id = b.general_id)
        AND (a.years_active IS NULL OR b.years_active IS NULL
             OR a.years_active && b.years_active)
        AND NOT (a.wikidata_id IS NULL AND b.wikidata_id IS NOT NULL
                 AND COALESCE(a.notes, '') LIKE '%kept separate after an uncertain match%')
        AND NOT (b.wikidata_id IS NULL AND a.wikidata_id IS NOT NULL
                 AND COALESCE(b.notes, '') LIKE '%kept separate after an uncertain match%')
    threshold: "= 0"
    severity: error
    description: "No two generals with the same name, overlapping years and a missing Wikidata id"

  - name: probable_duplicate_generals
    # The looser sibling of no_duplicate_generals: the same first and last name
    # token once folded, overlapping years, at least one side with no Q-id. It
    # catches one man split across spellings ("Karl von Wrede" and "Karl Philipp
    # von Wrede", "Gebhard von Blucher" and "Gebhard Leberecht von Blucher").
    # A warning, because two Romans can share both ends of a three-part name.
    # It also counts the deliberate UNCERTAIN splits that no_duplicate_generals
    # excludes (a corpus-local row noted "kept separate after an uncertain
    # match" beside a Wikidata row of the same folded name), including
    # one-token names like Xanthippus that the first/last-token rule skips.
    # On the 2026-10 pilot it found five real splits and one non-person pair.
    # Like no_duplicate_generals it counts only generals that a
    # battle_commanders row still links: a general kept alive solely by old
    # model-run references is not a live duplicate.
    check: >
      WITH n AS (
        SELECT g.general_id, g.wikidata_id, g.years_active,
               regexp_replace(
                 regexp_replace(translate(lower(g.canonical_name),
                   'àáâãäåçèéêëìíîïñòóôõöùúûüýÿšžłø', 'aaaaaaceeeeiiiinooooouuuuyyszlo'),
                   '[^a-z0-9 ]+', '', 'g'),
                 ' +', ' ', 'g') AS nm,
               COALESCE(g.notes, '') LIKE '%kept separate after an uncertain match%' AS uncertain_split
        FROM generals g
        WHERE EXISTS (SELECT 1 FROM battle_commanders bc WHERE bc.general_id = g.general_id)
      ), k AS (
        SELECT *, split_part(nm, ' ', 1) AS first_tok,
               (regexp_split_to_array(nm, ' '))[
                 array_length(regexp_split_to_array(nm, ' '), 1)] AS last_tok
        FROM n
      )
      SELECT COUNT(*) FROM k a
      JOIN k b ON a.general_id < b.general_id
       AND ((a.first_tok = b.first_tok AND a.last_tok = b.last_tok
             AND a.first_tok <> a.last_tok)
            OR (replace(a.nm, ' ', '') = replace(b.nm, ' ', '')
                AND ((a.wikidata_id IS NULL AND a.uncertain_split AND b.wikidata_id IS NOT NULL)
                  OR (b.wikidata_id IS NULL AND b.uncertain_split AND a.wikidata_id IS NOT NULL))))
      WHERE (a.wikidata_id IS NULL OR b.wikidata_id IS NULL)
        AND (a.years_active IS NULL OR b.years_active IS NULL
             OR a.years_active && b.years_active)
    threshold: "= 0"
    severity: warning
    description: "Few generals should look like one person split across spellings"

  - name: wikidata_link_rate
    # The honest measure of "backed by a Wikidata entity where possible".
    # Unlike alias_coverage this one can fail: a general with no Q-id is a
    # corpus-local identity that no later run can reconcile against anything.
    check: >
      SELECT COUNT(*) FILTER (WHERE wikidata_id IS NOT NULL)::float
           / NULLIF(COUNT(*), 0)
      FROM generals
    threshold: ">= 0.60"
    severity: warning
    description: "Most resolved generals should carry a Wikidata id"

  - name: commanders_per_battle
    # Moved here from agents/extract.yaml, where it counted a table the
    # extract stage does not write and so could only ever report 0.
    check: >
      SELECT AVG(commander_count) FROM (
        SELECT b.battle_id, COUNT(bc.bc_id) AS commander_count
        FROM battles b
        LEFT JOIN battle_commanders bc ON bc.battle_id = b.battle_id
        GROUP BY b.battle_id
      ) t
    threshold: ">= 2.0"
    severity: warning
    description: "Average commanders per battle should be at least 2 (one per side)"

  - name: alias_coverage
    # Near-vacuous by construction: the stage writes a primary alias for
    # every general it creates, so this reads about 1.0 on any run that wrote
    # anything. Kept because it does still catch the alias write failing
    # outright, not because a pass means the aliases are good.
    check: >
      SELECT COUNT(DISTINCT general_id)::float / NULLIF(
        (SELECT COUNT(*) FROM generals), 0)
      FROM general_aliases
    threshold: ">= 0.70"
    severity: warning
    description: "Most generals should have at least one alias entry"

retry_policy:
  max_stage_retries: 2
  on_failure: pause_and_alert
