stage: resolve
description: >
  Entity resolution for commanders and battles. Link every extracted
  commander mention to a canonical general_id (backed by a Wikidata entity
  where possible). Merge duplicate battle records. Build the general_aliases
  table. This stage uses a hybrid approach: deterministic matching first,
  then LLM-assisted disambiguation for ambiguous cases.

inputs:
  - data/processed/commanders_raw.jsonl
  - data/processed/battles.jsonl
  - data/raw/wikidata/

outputs:
  - db: generals, general_aliases, battle_commanders (general_id populated)
  - data/processed/resolution_log.jsonl    # audit trail of every merge/link decision

tools:
  - wikidata_sparql
  - llm_disambiguate
  - db_upsert
  - fuzzy_match               # rapidfuzz for string similarity

params:
  fuzzy_threshold: 85          # minimum similarity score for candidate matches
  # How far the best candidate must beat the runner-up to be accepted without
  # asking the LLM. Two entities scoring within this of each other are
  # usually a father and a son.
  ambiguity_margin: 6

  # Where candidates come from: 'sparql' queries the live Wikidata endpoint,
  # 'local' indexes the entity JSON already under data/raw/wikidata, 'none'
  # resolves everything as a new entity. 'local' and 'none' need no network.
  candidate_source: sparql
  sparql_batch_size: 25        # names per query; the endpoint times out on large ones
  max_names_per_group: 3       # surface forms of one person to ask about
  rate_limit_sparql: 2.0       # seconds between queries; stricter than the article API
  respect_robots: true

  # Duplicate battle detection. The stage reports suspected pairs to
  # data/processed/duplicate_battles.jsonl and never merges them: merging two
  # battle rows re-parents their sides, troop reports and commanders, and a
  # wrong merge destroys the outcome data the model is fitted to.
  battle_duplicate_threshold: 92    # name similarity, after "Battle of" is stripped
  battle_duplicate_year_slack: 1    # years apart two records of one battle may be

  processed_root: data/processed
  raw_root: data/raw

  # Gemini serves this stage too. Most resolution is SPARQL plus rapidfuzz;
  # the LLM only breaks ties the fuzzy matcher leaves ambiguous, so the
  # judgement asked of it is narrow and well bounded.
  llm_provider: gemini
  llm_model: gemini-3.8-flash
  llm_temperature: 0.0

steps:
  # Step 1: deterministic — exact name match to Wikidata
  - name: exact_wikidata_match
    method: deterministic
    description: >
      For each unique commander name, query Wikidata for entities with
      matching labels that are instances of "human" (Q5) and have
      "military commander" (Q47064) or similar occupation. Exact matches
      on the English label get linked automatically.

  # Step 2: deterministic — fuzzy match + context
  - name: fuzzy_contextual_match
    method: deterministic
    description: >
      For unresolved names, run fuzzy matching against the generals table
      and Wikidata candidates. Candidates must share at least one battle's
      war/era/polity to be considered. Matches above the fuzzy_threshold
      with matching context are linked automatically.

  # Step 3: LLM-assisted — true ambiguity
  - name: llm_disambiguation
    method: llm
    description: >
      For remaining unresolved names (typically <5% of total), present
      the LLM with the commander mention, its battle context, and the
      top candidate entities. Ask it to choose or flag as genuinely new.

prompt:
  system: |
    You are a military history entity resolution assistant. Given a
    commander name extracted from a battle article and a list of candidate
    Wikidata entities, determine which candidate (if any) is the correct
    match. Consider:
    - The time period and region of the battle
    - The side/polity the commander fought for
    - The commander's described rank or role
    - Alternative name spellings, transliterations, regnal numbers

    If none of the candidates match, respond with "NEW_ENTITY" and provide
    the best canonical name. If the match is uncertain, respond with
    "UNCERTAIN" and your best guess with a confidence score.

  user_template: |
    Commander mention: "{name}"
    Battle: {battle_name} ({date}, {war})
    Side: {side_label}
    Role described: {apparent_role}
    Context: "{role_evidence}"

    Candidates:
    {candidates_formatted}

    Which candidate matches this commander? Respond with JSON:
    {{"match": "<wikidata_id or NEW_ENTITY or UNCERTAIN>", "confidence": 0.0-1.0, "reasoning": "..."}}

  # The stage loads this at run time and hands it to the LLM layer, which
  # validates every response against it. A Q-id cannot be constrained to the
  # candidates actually offered, so the stage checks that separately and
  # treats an unoffered id as a refusal to match.
  output_schema:
    type: object
    required: [match, confidence]
    properties:
      match:
        type: string
        description: "A Wikidata Q-id, or NEW_ENTITY, or UNCERTAIN"
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0
      reasoning:
        type: string

quality_checks:
  - name: resolution_rate
    # battle_commanders.general_id is NOT NULL, so counting non-null ids in
    # that table divides written rows by written rows and reports 1.0 however
    # many mentions the stage lost. The real denominator is written rows plus
    # the mentions resolve could not place, which it records in
    # missing_data_log under commander_general_id.
    check: >
      SELECT (SELECT COUNT(*) FROM battle_commanders)::float
           / NULLIF(
               (SELECT COUNT(*) FROM battle_commanders)
             + (SELECT COUNT(*) FROM missing_data_log
                 WHERE field_name = 'commander_general_id'), 0)
    threshold: ">= 0.90"
    severity: warning
    description: "At least 90% of commander mentions should reach battle_commanders"

  - name: no_duplicate_generals
    check: >
      SELECT COUNT(*) FROM (
        SELECT wikidata_id, COUNT(*) as n
        FROM generals
        WHERE wikidata_id IS NOT NULL
        GROUP BY wikidata_id
        HAVING COUNT(*) > 1
      ) t
    threshold: "= 0"
    severity: error

  - name: wikidata_link_rate
    # The honest measure of "backed by a Wikidata entity where possible".
    # Unlike alias_coverage this one can fail: a general with no Q-id is a
    # corpus-local identity that no later run can reconcile against anything.
    check: >
      SELECT COUNT(*) FILTER (WHERE wikidata_id IS NOT NULL)::float
           / NULLIF(COUNT(*), 0)
      FROM generals
    threshold: ">= 0.60"
    severity: warning
    description: "Most resolved generals should carry a Wikidata id"

  - name: commanders_per_battle
    # Moved here from agents/extract.yaml, where it counted a table the
    # extract stage does not write and so could only ever report 0.
    check: >
      SELECT AVG(commander_count) FROM (
        SELECT b.battle_id, COUNT(bc.bc_id) AS commander_count
        FROM battles b
        LEFT JOIN battle_commanders bc ON bc.battle_id = b.battle_id
        GROUP BY b.battle_id
      ) t
    threshold: ">= 2.0"
    severity: warning
    description: "Average commanders per battle should be at least 2 (one per side)"

  - name: alias_coverage
    # Near-vacuous by construction: the stage writes a primary alias for
    # every general it creates, so this reads about 1.0 on any run that wrote
    # anything. Kept because it does still catch the alias write failing
    # outright, not because a pass means the aliases are good.
    check: >
      SELECT COUNT(DISTINCT general_id)::float / NULLIF(
        (SELECT COUNT(*) FROM generals), 0)
      FROM general_aliases
    threshold: ">= 0.70"
    severity: warning
    description: "Most generals should have at least one alias entry"

retry_policy:
  max_stage_retries: 2
  on_failure: pause_and_alert
