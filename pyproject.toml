[project]
name = "general-war"
version = "0.1.0"
description = "Bayesian Wins Above Replacement ranking for military commanders"
requires-python = ">=3.11"
dependencies = [
    # web scraping & data collection
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "mwparserfromhell>=0.6",
    "SPARQLWrapper>=2.0",

    # data processing
    "pandas>=2.2",
    "polars>=1.0",

    # database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",

    # bayesian modelling
    "pymc>=5.10",
    "arviz>=0.18",
    "cmdstanpy>=1.2",

    # LLM extraction
    # anthropic 1.x is a major-version break from 0.x (httpx2, removed
    # deprecated params); pipeline/llm/anthropic_client.py targets 1.x.
    "anthropic>=1.0",
    "google-genai>=2.3",
    "jsonschema>=4.21",

    # entity resolution
    "rapidfuzz>=3.6",

    # utilities
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Nothing read .env until pipeline.config.load_env existed; the file was
    # written, documented, and consumed only by an unused docker-compose.
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",

    # visualisation
    "plotly>=5.18",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Stubs mypy --strict needs to type the YAML and jsonschema boundaries.
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

# google-genai ships no py.typed marker, so its types are unavailable.
# Scoped to that package rather than relaxing the global setting.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live PostgreSQL instance (make db-up); skipped otherwise",
    "live: makes real requests to a third party; opt in with GENERAL_WAR_LIVE_CRAWL=1",
]
