[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-war"
version = "0.1.0"
description = "Bayesian Wins Above Replacement ranking for military commanders"
requires-python = ">=3.11"
dependencies = [
    # web scraping & data collection
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "mwparserfromhell>=0.6",
    "SPARQLWrapper>=2.0",

    # data processing
    "pandas>=2.2",
    "polars>=1.0",

    # database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",

    # bayesian modelling
    # Upper-bounded on purpose. pymc 5.28.5 resolves pytensor 2.38.2, which
    # publishes cp314 wheels and declares requires-python >=3.11,<3.15 -- so one
    # pin installs on the 3.14 development machine and on CI's 3.11. pymc 6.x
    # requires >=3.12 and would break the CI job outright; it also moves to
    # arviz 1.x, a rewritten API.
    "pymc>=5.28,<6",
    "arviz>=0.18,<1",
    # Measured, not assumed. PyTensor needs g++ to compile its C backend and
    # falls back to Python without one -- 42s to sample a two-parameter toy on
    # the development machine, which puts the reconcile model out of reach.
    # nutpie compiles the logp through numba instead, needs no toolchain, and
    # fits a 300-side hierarchical model in 19s. It is the default sampler for
    # the reconcile stage; see agents/reconcile.yaml params.nuts_sampler.
    "nutpie>=0.13",
    "cmdstanpy>=1.2",

    # LLM extraction
    # anthropic 1.x is a major-version break from 0.x (httpx2, removed
    # deprecated params); pipeline/llm/anthropic_client.py targets 1.x.
    "anthropic>=1.0",
    "google-genai>=2.3",
    "jsonschema>=4.21",

    # entity resolution
    "rapidfuzz>=3.6",

    # utilities
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Nothing read .env until pipeline.config.load_env existed; the file was
    # written, documented, and consumed only by an unused docker-compose.
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",

    # visualisation
    "plotly>=5.18",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Stubs mypy --strict needs to type the YAML and jsonschema boundaries.
    # Both were installed on the development machine and only one was declared,
    # so the lint job failed on a stub that had been present here all along.
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

# Without this, setuptools' flat-layout auto-discovery sees agents/, config/,
# data/, models/ and alembic/ alongside pipeline/, refuses to guess, and the
# install fails before a single check runs. pipeline is the only importable
# package; scripts/ and models/ are run from a checkout, not installed.
[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

# google-genai ships no py.typed marker, so its types are unavailable.
# Scoped to that package rather than relaxing the global setting.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

# The PyMC stack is untyped at the boundary: pymc and arviz ship no py.typed,
# and pytensor's symbolic tensors have no static type mypy can follow. Scoped
# to these packages so the rest of pipeline/ stays strict.
#
# follow_imports = "skip" as well as ignore_missing_imports, because arviz
# pulls in zarr, which uses PEP 695 type-parameter syntax. mypy runs here with
# python_version = "3.11" to match CI, so following that source is a hard
# syntax error in a third-party package we do not control.
[[tool.mypy.overrides]]
module = ["pymc.*", "pytensor.*", "arviz.*", "xarray.*", "zarr.*", "nutpie.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live PostgreSQL instance (make db-up); skipped otherwise",
    "live: makes real requests to a third party; opt in with GENERAL_WAR_LIVE_CRAWL=1",
    # Deselected rather than skipped in CI: the test job fails the build on any
    # skip, because a green run full of skips is what hid two schema bugs.
    "model: fits a real MCMC model; minutes, not seconds, and needs pymc",
]
