  - id: ov-0095
    kind: troop_strength
    target: {battle: Battle_of_Stalingrad-9e41ff979f, side: Soviet Union}
    value: {low: 1103000, high: 1143500}
    scope: deployed
    source: "Glantz and House, When Titans Clashed (1995), p. 134, and Istoriya Vtoroi Mirovoi Voiny 1939-1945, vol. 6 (Voenizdat 1976), p. 35, as cited in Wikipedia, 'Battle of Stalingrad', infobox strength2, 'During the Soviet counter-offensive'"
    note: "The rows were 187,000 (opening of the Axis offensive, July 1942) and 1,103,000-1,143,500 (start of Uranus, 19 November 1942): same scope, different phases. The counter-offensive decided the battle, so its figures are used for both sides (ov-0096). Stopgap until the battle is split by phase."
