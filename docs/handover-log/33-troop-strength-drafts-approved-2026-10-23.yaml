# troop_strength entries approved by the user on 2026-10-23 (handover-log §33).
# Drafted by historiography-reviewer from current Wikipedia wikitext; page
# numbers are as cited by Wikipedia, not checked in the books. ov-0093 (PLO,
# Lebanon 1982) was not approved. Wars stored as battles (ov-0090, 0091, 0092,
# 0099) and Stalingrad (ov-0095, 0096, counter-offensive phase) are stopgaps
# with TODOs to exclude or split. Copy into config/overrides.yaml in the final
# format of the troop_strength kind (wip/troop-scope).

  - id: ov-0090
    kind: troop_strength
    target: {battle: Yom_Kippur_War-3c934020bf, side: Egypt}
    value: {low: 914000, high: 1067500}
    scope: deployed
    source: "Wikipedia, 'Yom Kippur War', infobox strength1 'Total' row, the sum of the cited national figures (Egypt 650,000 Rabinovich 2004 p. 54 to 850,000 Herzog 1975 p. 239; Syria 150,000 Rabinovich 2004 p. 54 to 300,000 Gilbert 2008 p. 436; expeditionary forces 120,000 Rabinovich 2004 p. 54)"
    note: "The side carries the whole Arab coalition's infobox: eleven 'total' rows from Cuba's 500 to the coalition's 1,067,500, all read as rival claims for one side, so reconcile settled at 73,684. The Israel side is the IDF's mobilised 375,000-415,000 (Rabinovich p. 54), so the coalition's total strength is the like-for-like figure. Stopgap: this is a war, not a battle."
    reviewed: {by: lee, "on": 2026-10-23}

  - id: ov-0091
