    note: "The rows mix Jordan 45,000 deployed / 55,000 total, Syria 75,000, Egypt 100,000 deployed / 160,000 total and the Arab total of 465,000. Israel's only figure is '264,000 total' (Stone 2004 p. 217), so the Arab total is the like-for-like figure. Stopgap: this is a war, not a battle."
