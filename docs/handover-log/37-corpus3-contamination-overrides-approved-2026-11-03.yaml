  - id: ov-0550
    kind: troop_strength
    target: {battle: Battle_of_the_Seelow_Heights-95c85baa0a, side: Soviet Union}
    value: {point: 1000000}
    scope: theatre_strength
    source: "Wikipedia, 'Battle of the Seelow Heights', lead ('Close to 1,000,000 Soviet soldiers of the 1st Belorussian Front (including 78,556 soldiers of the Polish 1st Army)') and section 'Battle' ('only two of the five armies of the 1st Belorussian Front attacked the Seelow Heights themselves', citing Isaev 2006 pp. 377-389 and Isaev 2007 pp. 421, 690); German side 'about 110,000 soldiers of the German 9th Army' (Le Tissier 1996 p. 273), infobox 112,143 (Isaev 2007 pp. 293-295 for the tanks and guns)"
    note: "The 1,000,000 row is the whole 1st Belorussian Front, read as engaged. Neither the article nor its cited sources give a Seelow-only Soviet figure: the front's 11 armies held the line from Schwedt to Guben and about two attacked the heights. The German 112,143 is the whole 9th Army, which held Finow Canal to Guben, so both sides are formation-level figures. The value keeps the front's number and corrects the scope to theatre_strength so reconcile does not treat it as a field force. Open for the user: a Seelow-only figure needs Isaev or Glantz army-level strengths, which this draft could not verify."
    reviewed: {by: historiography-reviewer, "on": 2026-11-03}
