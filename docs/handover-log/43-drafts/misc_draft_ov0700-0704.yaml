    source: "Wikipedia, 'Battle of Actium', infobox strength1 ('250-400 galleys; 16,000 infantry on ships; 3,000 archers'), citing Lendering (Livius.org)"
    note: "Side 125 is Octavian's forces. The infobox lists galleys, 16,000 infantry on ships and 3,000 archers. The parser stored the 3,000 archers as the side's 'total' (the 16,000 went to the infantry branch), so reconcile used about 3,006. The fighting complement aboard is 16,000 marines plus 3,000 archers = 19,000; rowers and the galley count are not included. The 3,000 was only the archer component."
