# (C) Reviewed and NOT retyped. Commented out; delete the comment marker to override the call.
#
# Fragments: the credited children cover only part of the parent, so retyping would lose most of it.
# Battle_of_the_Bulge-35837b5379 (15 generals): credited children are Elsenborn Ridge (5 generals) and Heartbreak Crossroads (3). Overlap is Bradley and Dietrich only. Keep the parent.
# Battle_of_Gazala-31b0a03912 (11 generals): children Bir Hakeim and Axis capture of Tobruk cover 2 of many actions, but Tobruk repeats 7 of 8 parent generals (Rommel, Nehring, Ritchie, Gott and others), a real double count. Keep; user may prefer to retype Gazala and accept losing Auchinleck, Norrie and Bastico.
# Battle_of_Berlin-e9d1deec09 (8 generals): Seelow Heights and Halbe are credited, but the city fight itself has no row. Retyping would drop Weidling's only credited row and the Hitler, Stalin and Rokossovsky rows for this battle, while Zhukov and Konev (8 and 6 rows) lose one. Keep and flag; the double count on Zhukov and Konev stays.
# Battle_of_Kursk-045b980c2f (26 generals): only Belgorod (1 general, Manstein) is a real child. Third Battle of Kharkov is a separate battle (February 1943) that the Kursk row's dummy 1 January start date makes look nested. Keep.
