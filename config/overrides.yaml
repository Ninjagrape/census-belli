# Hand-curated corrections that stages apply after their own logic, on every run.
# Design and entry kinds: docs/handover/07-phase2-overrides-design.md
# Every entry needs a citation (source) and a reviewer (reviewed.by / reviewed.on).
# Entries drafted by historiography-reviewer against general_war_corpus2 and
# approved by the user 2026-10-17/18. BC dates are written as PostgreSQL renders
# them ("0480-09-01 BC"). "on" is quoted: YAML 1.1 reads a bare on as true.
version: 1
entries:
  # --- outcome ------------------------------------------------------------------
  - id: ov-0001
    kind: outcome
    target: {battle: Battle_of_Asculum-e156b37d06}
    value:
      Epirotes: pyrrhic_victory
      Roman Republic: defeat
    source: "Plutarch, Pyrrhus 21.8-10; Wikipedia, 'Battle of Asculum', lead and section 'Aftermath'"
    note: "The infobox reads 'Greek victory', so extract coded a plain victory. Asculum is the battle that gave 'Pyrrhic victory' its name (Pyrrhus' remark in Plutarch); the model scores pyrrhic as a win, so this changes the record, not the fit."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0002
    kind: outcome
    target: {battle: Battle_of_Belmont-e439b08aca}
    value:
      United States (Union): indecisive
      CSA (Confederacy): indecisive
    source: "American Battlefield Trust, 'Belmont' battle page (Result: Inconclusive); Wikipedia, 'Battle of Belmont', section 'Aftermath'"
    note: "No outcome was extracted (infobox 'See aftermath'). Grant overran the Confederate camp, then was driven back to his boats; losses were near equal (607 vs 641) and the CWSAC/ABT summary codes it inconclusive. Confederate victory is the minority reading."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0003
    kind: outcome
    target: {battle: Battle_of_Bir_Hakeim-cde68737ef}
    value:
      Free France: defeat
      Nazi Germany: victory
    source: "Wikipedia, 'Battle of Bir Hakeim', section 'Aftermath' (subsection 'Analysis', citing Playfair, The Mediterranean and Middle East vol. III)"
    note: "No outcome was extracted (infobox 'See Aftermath section'). On the tactical standard the corpus uses, the Axis took the position and the garrison broke out and abandoned it; the delay imposed on Rommel is a strategic gain for the Allies that the outcome scale does not carry."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0004
    kind: outcome
    target: {battle: Battle_of_Borodino-8c0686ddbc}
    value:
      First French Empire: pyrrhic_victory
      Russian Empire: defeat
    source: "Wikipedia, 'Battle of Borodino', section 'Aftermath', subsection 'An indecisive victory'"
    note: "No outcome was extracted (infobox 'See § Aftermath'). Napoleon held the field and Kutuzov withdrew next day, so tactically a French win at ruinous cost; the article reports most scholars call it a draw or a Pyrrhic French victory. Pyrrhic (scored as a win) rather than indecisive because the corpus grades on tactical result."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0005
    kind: outcome
    target: {battle: Battle_of_Kasserine_Pass-72c07c66a7}
    value:
      United States: defeat
      Nazi Germany: victory
    source: "Martin Blumenson, Rommel's Last Victory: The Battle of Kasserine Pass (1967); Wikipedia, 'Battle of Kasserine Pass', section 'Aftermath'"
    note: "No outcome was extracted (infobox 'See Aftermath'). The Axis broke through and inflicted a heavy defeat on US II Corps before withdrawing for lack of fuel and reserves; the Allied reoccupation of the pass on 24-25 February followed an Axis withdrawal, not a defeat in battle."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0006
    kind: outcome
    target: {battle: Battle_of_Lobositz-b8d54b4229}
    value:
      Prussia: victory
      Austria: defeat
    source: "Christopher Duffy, Frederick the Great: A Military Life (1985), pp. 101-105, as cited in Wikipedia, 'Battle of Lobositz', section 'Aftermath'"
    note: "The outcome LLM followed the article's strategic framing and credited Austria. Frederick held the field, Browne withdrew overnight to Budin, and Browne's relief of the Saxons at Pirna failed (they surrendered by 14 October): a narrow Prussian tactical victory at near-equal cost."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0007
    kind: outcome
    target: {battle: Battle_of_Maloyaroslavets-c0876852e8}
    value:
      French Empire: victory
      Russian Empire: defeat
    source: "Wikipedia, 'Battle of Maloyaroslavets', section 'Aftermath'"
    note: "No outcome was extracted (infobox 'See § Aftermath'). Eugène's corps held the town after it changed hands repeatedly and Kutuzov withdrew south before dawn; the Russian gain (Napoleon turned back onto the devastated Smolensk road) is strategic, which the corpus does not score."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

  - id: ov-0008
    kind: outcome
    target: {battle: Battle_of_Reims_1814-eb6bc9a73a}
    value:
      France: victory
      Russia: defeat
    source: "David G. Chandler, The Campaigns of Napoleon (1966), p. 993, as cited in Wikipedia, 'Battle of Reims (1814)'; infobox 'French victory - 13th'"
    note: "The infobox splits the result by day (Coalition 12 March, French 13 March) and the outcome request answered 'unclear'. This record is the 13 March battle (date_start 1814-03-13, Napoleon commanding), which Napoleon won decisively, routing Saint-Priest's Russo-Prussian corps and retaking the city."
    reviewed: {by: historiography-reviewer, "on": 2026-10-17}

