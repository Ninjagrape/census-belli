  - id: ov-0103
    kind: troop_strength
    target: {battle: Battle_of_the_Kalka_River-644c126698, side: Principality of Kiev}
    value: {low: 10000, high: 30000}
    scope: deployed
    source: "D. G. Khrustalev (2013), Russkie na Kalke / Rus' i mongoly, pp. 85-86, 416 (c. 10,000 Rus' plus 5,000 Cuman cavalry); Leo de Hartog, Genghis Khan: Conqueror of the World (1989), p. 120 (30,000); Carl Fredrik Sverdrup, The Mongol Conquests (Helion 2017), p. 206 (about 8,000; calls 30,000 and 80,000 'enormous exaggerations'); John Fennell, The Crisis of Medieval Russia 1200-1304 (1983), pp. 66-68 (chronicle figures imply about 11,000); all as cited in Wikipedia, 'Battle of the Kalka River', section on army sizes"
    note: "Current rows are one 'modern estimates' line of 60,000-100,000 (no author, no page), which reconciled to 61,620. The books above were not opened, and each figure is read through the Wikipedia article's citation. Gabriel (p. 98) and Munro give 80,000, and Soviet-era historians gave 80,000-100,000, but these trace to the chronicles. Astaykin and Pyatnov (2023) give 20,000-30,000 Rus' warriors plus an unknown number of Cumans and Black Klobuks. The range 10,000-30,000 covers the quantified modern estimates except Sverdrup's 8,000. No consensus; a judgement call the user approved. The Mongol side (reconciled 26,307) already sits near de Hartog's 20,000 and Gabriel's 23,000, so no entry for it."
    reviewed: {by: lee, "on": 2026-10-29}

