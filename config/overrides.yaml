    source: "Wikipedia, 'Battle of Waterloo', infobox (separate commanders and units for Wellington's army and Blücher's army; Blücher's army: I, II and IV Corps under Zieten, Pirch and Bülow) and sections 'Prelude' and 'Armies' (two independent armies; on 18 June Blücher assured Wellington of Prussian support)"
    note: "The side holds two allied armies, and Blücher commanded the Prussian one in his own right, not as Wellington's subordinate: Wellington could not give him orders. The LLM made him a rank-1 subordinate with no reports_to. He becomes a co-field commander (rank 0) with his weight unchanged at 0.25, and the Prussian corps and staff officers report to him as rank 1. Wellington stays at 0.40, and all other weights are unchanged. The weights still sum to 1.00. The 0.40/0.25 split is the classifier's, not a scholarly measure of relative credit."
