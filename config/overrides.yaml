  # --- battle_split -------------------------------------------------------------
  - id: ov-0089
    kind: battle_split
    target: {battle: Battle_of_Jena_Auerstedt-7e1600f782}
    value:
      - {key: jena, name: "Battle of Jena", heading: "Jena"}
      - {key: auerstedt, name: "Battle of Auerstedt", heading: "Auerstedt"}
    source: "Wikipedia, 'Battle of Jena-Auerstedt', infobox (commander and strength lists headed 'Jena' and 'Auerstedt'); Chandler, The Campaigns of Napoleon (1966), pp. 479-488"
    note: "Two separate battles fought on 14 October 1806: Jena (Napoleon against Hohenlohe) and Auerstedt (Davout against Brunswick). One record reconciled Prussia's partial figures as competing reports of one total and credited Davout's victory to Napoleon. Extract writes one battle per part, keyed '<slug>#jena' and '<slug>#auerstedt'. Infobox lines that carry no part label ('Total engaged', the combined casualty totals) describe the whole and are written to neither part. Replaces ov-0029 and ov-0030, which unlinked the 'Jena:' heading that is no longer read as a commander."
    reviewed: {by: lee, "on": 2026-10-22}

