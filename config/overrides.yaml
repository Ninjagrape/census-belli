    note: "Current rows are '125,000 troops' (reconciled 127,728), which is all French North Africa including 15,000 in Tunisia where nobody landed. Morocco plus Algeria (Casablanca, Oran, Algiers) is 105,000 on Howe's Allied-intelligence planning figures; Wikipedia's 60,000 for Morocco would give 110,000. These are garrisons, not troops engaged: most units were not in action, and Barjot's present-for-duty totals are lower. No engaged-strength or per-landing figure exists. Paired with ov-0099, whose Allied total of 107,000 is the three task forces."
    reviewed: {by: lee, "on": 2026-10-29}

