  # --- corpus3 first run (approved 2026-10-29) ---
  - id: ov-0101
    kind: outcome
    target: {battle: Battle_of_Beneventum_275_BC-cac46f3a44}
    value:
      Roman Republic: victory
      Epirus: defeat
    source: "Plutarch, Pyrrhus 25; Dionysius of Halicarnassus, Roman Antiquities 20.11-12; Wikipedia, 'Battle of Beneventum (275 BC)', infobox (Result: 'Inconclusive, Roman strategic victory', citing Kent 2020, p. 122) and section 'Aftermath' (Pyrrhus returns to Tarentum, then Epirus; Franke, Cambridge Ancient History vol. 7 part 2, pp. 481-483, for the Roman strategic victory)"
    note: "Coded indecisive on both sides. Pyrrhus' wing was routed by the elephant stampede, he left Italy within the year, and Tarentum fell to Rome in 272. Rome held the field and ended the war, and the corpus grades on tactical result, so this is a Roman victory. Minority view, stated in the Wikipedia article and attributed to Kent 2020 p. 122: some historians call the battle a draw, because Pyrrhus kept a substantial army (he sailed home with 8,000 foot and 500 horse) and the Romans gained no great victory. A draw is a defensible reading, so this entry changes Pyrrhus' record from an unscored draw to a loss. The slug is the one that holds the sides. A second, sideless row 'Battle_of_Beneventum_275_BC-91d14155d6' (battle_id 32 in corpus2) is a shell and is not targeted."
    reviewed: {by: lee, "on": 2026-10-29}

